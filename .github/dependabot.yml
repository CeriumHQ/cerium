# Workflow actions are pinned to commit SHAs; Dependabot keeps them current in one monthly pull request.
# npm dependencies stay out: they are upgraded on purpose, one package family at a time.
version: 2
updates:
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: monthly
    # A release is a week old before it's proposed, so a compromised or broken one is usually pulled
    # by then.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
      include: scope
