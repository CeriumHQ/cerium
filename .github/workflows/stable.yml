name: Stable release

# Once a day the newest nightly's commit, which passed CI, is rebuilt and published as a stable
# release when anything that ships changed since the last one (scripts/release.ts).
on:
  schedule:
    - cron: "17 1 * * *" # 04:17 at UTC+3
  workflow_dispatch:
    inputs:
      version:
        description: Release this version instead of the computed one, e.g. 1.0.0
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: stable-release

defaults:
  run:
    shell: bash

jobs:
  # Deciding runs on its own, so a day with nothing to release never starts a packaging runner.
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
      version: ${{ steps.plan.outputs.version }}
      commit: ${{ steps.plan.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - id: plan
        run: node scripts/release.ts stable --version="$VERSION"
        env:
          VERSION: ${{ inputs.version }}

  # The web app and every package build side by side, each processor's packages on its own runner,
  # packed smallest (.github/actions/web, .github/actions/package).
  web:
    name: Build the web app
    needs: plan
    if: ${{ needs.plan.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.commit }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/web
        with:
          version: ${{ needs.plan.outputs.version }}

  package-linux:
    name: Package (Linux ${{ matrix.arch }})
    needs: plan
    if: ${{ needs.plan.outputs.publish == 'true' }}
    strategy:
      matrix:
        include:
          - { arch: x64, runner: ubuntu-latest }
          - { arch: Arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.commit }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/package
        with:
          version: ${{ needs.plan.outputs.version }}
          compression: maximum
          sentry-dsn: ${{ vars.SENTRY_DSN }}

  package-windows:
    name: Package (Windows ${{ matrix.arch }})
    needs: plan
    if: ${{ needs.plan.outputs.publish == 'true' }}
    strategy:
      matrix:
        include:
          - { arch: x64, runner: windows-latest }
          - { arch: Arm64, runner: windows-11-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.commit }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/package
        with:
          version: ${{ needs.plan.outputs.version }}
          compression: maximum
          sentry-dsn: ${{ vars.SENTRY_DSN }}

  # Both packaged on Apple silicon, the Intel app too, on the runner the nightlies use
  # (.github/workflows/ci.yml). Signed with the repository's Developer ID and notarized when it has
  # them, else signed ad hoc.
  package-macos:
    name: Package (macOS ${{ matrix.arch }})
    needs: plan
    if: ${{ needs.plan.outputs.publish == 'true' }}
    strategy:
      matrix:
        include:
          - { arch: Arm64 }
          - { arch: x64, cross: x64 }
    runs-on: ${{ vars.MAC_RUNNER || 'macos-15' }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.commit }}
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cpu: ${{ matrix.cross && '*' || '' }}
      - uses: ./.github/actions/package
        with:
          version: ${{ needs.plan.outputs.version }}
          arch: ${{ matrix.cross }}
          compression: maximum
          sentry-dsn: ${{ vars.SENTRY_DSN }}
          mac-certificate: ${{ secrets.MAC_CERTIFICATE }}
          mac-certificate-password: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          apple-api-key: ${{ secrets.APPLE_API_KEY }}
          apple-api-key-id: ${{ secrets.APPLE_API_KEY_ID }}
          apple-api-issuer: ${{ secrets.APPLE_API_ISSUER }}

  # The relay first, so it already reads what the new version sends, then the release with every
  # package and the web UI, which installed apps update from.
  publish:
    name: Publish
    needs: [plan, web, package-linux, package-windows, package-macos]
    if: ${{ needs.plan.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      # Re-checks the plan, in case a stable was released from this commit meanwhile.
      - id: notes
        name: Write the release notes
        run: node scripts/release.ts stable --commit="$COMMIT" --version="$VERSION" --notes="$RUNNER_TEMP/notes.md"
        env:
          COMMIT: ${{ needs.plan.outputs.commit }}
          VERSION: ${{ needs.plan.outputs.version }}
      # Each runner's packages in a folder of their own, then all in one, with the update files two
      # runners both wrote merged (scripts/merge-update-files.ts).
      - name: Fetch the packages
        if: ${{ steps.notes.outputs.publish == 'true' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: package-*
          path: ${{ runner.temp }}/packages
      - name: Gather the packages
        if: ${{ steps.notes.outputs.publish == 'true' }}
        run: node scripts/merge-update-files.ts "$RUNNER_TEMP/packages" apps/desktop/out
      - name: Fetch the web app
        if: ${{ steps.notes.outputs.publish == 'true' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web
          path: apps
      # Wrangler deploys the relay, which needs only the relay's own dependencies.
      - if: ${{ steps.notes.outputs.publish == 'true' }}
        uses: ./.github/actions/setup
        with:
          filter: "@cerium/relay"
      - name: Deploy the relay
        if: ${{ steps.notes.outputs.publish == 'true' }}
        uses: ./.github/actions/deploy-relay
        with:
          version: ${{ needs.plan.outputs.version }}
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          github-token: ${{ github.token }}
      - name: Publish
        if: ${{ steps.notes.outputs.publish == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.notes.outputs.tag }}
          TITLE: ${{ steps.notes.outputs.title }}
          COMMIT: ${{ needs.plan.outputs.commit }}
        run: |
          gh release create "$TAG" apps/desktop/out/* apps/relay/dist/cerium-web-*.tar.gz \
            --target "$COMMIT" --title "$TITLE" \
            --notes-file "$RUNNER_TEMP/notes.md" --latest
