name: Stable release

# Once a day, release the newest nightly when anything that ships changed (scripts/release.ts).
# Reuse a verified ad hoc candidate if one is ready. Signed releases build on the native runners.
on:
  schedule:
    - cron: "17 1 * * *" # 04:17 at UTC+3
  workflow_dispatch:
    inputs:
      version:
        description: Release this version instead of the computed one, e.g. 1.0.0
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: stable-release

defaults:
  run:
    shell: bash

jobs:
  # Deciding runs on its own, so a day with nothing to release never starts a packaging runner.
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
      version: ${{ steps.plan.outputs.version }}
      commit: ${{ steps.plan.outputs.commit }}
      candidate: ${{ steps.candidate.outputs.candidate }}
      release-id: ${{ steps.candidate.outputs.release-id }}
      digest: ${{ steps.candidate.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - id: plan
        run: node scripts/release.ts stable --version="$VERSION"
        env:
          VERSION: ${{ inputs.version }}

      - id: candidate
        name: Look for a completed build of this exact release
        if: ${{ steps.plan.outputs.publish == 'true' && github.ref == 'refs/heads/main' && !github.event.repository.private && !github.event.repository.fork }}
        continue-on-error: true
        run: node scripts/stable-candidate.ts find
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNING_CONFIGURED: ${{ secrets.MAC_CERTIFICATE != '' || secrets.MAC_CERTIFICATE_PASSWORD != '' ||
            secrets.APPLE_API_KEY != '' || secrets.APPLE_API_KEY_ID != '' || secrets.APPLE_API_ISSUER != '' }}
          COMMIT: ${{ steps.plan.outputs.commit }}
          VERSION: ${{ steps.plan.outputs.version }}

  promote:
    name: Promote the stable candidate
    needs: plan
    if: ${{ needs.plan.outputs.candidate != '' }}
    concurrency: cerium-relay-release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      fallback: >-
        ${{ steps.checkout.outcome != 'success' || steps.node.outcome != 'success' ||
        (steps.notes.outputs.publish == 'true' && steps.reserve.outcome != 'success') }}
    env:
      COMMIT: ${{ needs.plan.outputs.commit }}
      VERSION: ${{ needs.plan.outputs.version }}
      CANDIDATE: ${{ needs.plan.outputs.candidate }}
    steps:
      - id: checkout
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - id: node
        if: ${{ steps.checkout.outcome == 'success' }}
        continue-on-error: true
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - id: notes
        name: Write the release notes
        if: ${{ steps.node.outcome == 'success' }}
        run: node scripts/release.ts stable --commit="$COMMIT" --version="$VERSION" --notes="$RUNNER_TEMP/notes.md"
      - id: stage
        name: Verify the draft and fetch the relay's build
        if: ${{ steps.notes.outputs.publish == 'true' }}
        continue-on-error: true
        run: node scripts/stable-candidate.ts stage
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_DIGEST: ${{ needs.plan.outputs.digest }}
          RELEASE_ID: ${{ needs.plan.outputs.release-id }}
          SENTRY_DSN: ${{ vars.SENTRY_DSN }}
          SIGNING_CONFIGURED: ${{ secrets.MAC_CERTIFICATE != '' || secrets.MAC_CERTIFICATE_PASSWORD != '' ||
            secrets.APPLE_API_KEY != '' || secrets.APPLE_API_KEY_ID != '' || secrets.APPLE_API_ISSUER != '' }}
      - id: setup
        if: ${{ steps.stage.outcome == 'success' }}
        continue-on-error: true
        uses: ./.github/actions/setup
        with:
          filter: "@cerium/relay"
      # A failure through this step can still use the cold build. Once deploy starts, an error
      # fails the release instead of trying a second deployment or publishing a second release.
      - id: reserve
        name: Verify the draft again and remove its private deploy bundle
        if: ${{ steps.setup.outcome == 'success' }}
        continue-on-error: true
        run: node scripts/stable-candidate.ts reserve
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Deploy the relay
        if: ${{ steps.reserve.outcome == 'success' }}
        uses: ./.github/actions/deploy-relay
        with:
          version: ${{ needs.plan.outputs.version }}
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          github-token: ${{ github.token }}
      - id: tag
        name: Push the stable tag
        if: ${{ steps.reserve.outcome == 'success' }}
        env: &stable-tag-env
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.notes.outputs.tag }}
          COMMIT: ${{ needs.plan.outputs.commit }}
        run: &push-stable-tag |
          # The Releases API can reject implicit tags on nightlies with a different workflow tree.
          # Publish from an explicit tag on the commit that was packaged.
          ref="refs/tags/$TAG"
          refs=$(git ls-remote origin "$ref" "$ref^{}")
          target=$(awk '$2 ~ /\^\{\}$/ {peeled=$1; next} {oid=$1} END {print peeled ? peeled : oid}' <<<"$refs")
          if [[ -n "$target" ]]; then
            if [[ "$target" != "$COMMIT" ]]; then
              echo "::error::The stable tag already points to a different commit."
              exit 1
            fi
            exit 0
          fi
          # The pre-push hook verifies source changes. This push only names a commit already built by CI.
          result=$(git -c credential.helper= -c 'credential.helper=!gh auth git-credential' \
            push --no-verify --porcelain origin "$COMMIT:$ref")
          echo "$result"
          if grep -q $'^\\*\t' <<<"$result"; then
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish the verified draft as stable
        if: ${{ steps.reserve.outcome == 'success' }}
        run: node scripts/stable-candidate.ts publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.notes.outputs.tag }}
          TITLE: ${{ steps.notes.outputs.title }}
      - name: Remove the tag if publication failed
        if: ${{ failure() && steps.tag.outputs.created == 'true' }}
        env: *stable-tag-env
        run: &rollback-stable-tag |
          # Release planning treats stable tags as published. Remove only this job's tag and
          # only when GitHub confirms there is no published release for it.
          response=$(gh api --include "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" 2>/dev/null) || {
            if [[ "$response" =~ ^HTTP/[^[:space:]]+[[:space:]]404[[:space:]] ]]; then
              ref="refs/tags/$TAG"
              git -c credential.helper= -c 'credential.helper=!gh auth git-credential' \
                push --no-verify --force-with-lease="$ref:$COMMIT" origin ":$ref"
            else
              echo "::warning::Could not verify release status for $TAG. The tag was left in place."
            fi
          }

  build:
    name: Build stable release
    needs: [plan, promote]
    if: >-
      ${{ !cancelled() && needs.plan.outputs.publish == 'true' &&
      (needs.promote.result == 'skipped' ||
      (needs.promote.result == 'success' && needs.promote.outputs.fallback == 'true')) }}
    uses: ./.github/workflows/stable-build.yml
    with:
      commit: ${{ needs.plan.outputs.commit }}
      version: ${{ needs.plan.outputs.version }}
    secrets:
      MAC_CERTIFICATE: ${{ secrets.MAC_CERTIFICATE }}
      MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

  # The relay first, so it already reads what the new version sends, then the release with every
  # package and the web UI, which installed apps update from.
  publish:
    name: Publish
    needs: [plan, build]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    concurrency: cerium-relay-release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      # Re-checks the plan, in case a stable was released from this commit meanwhile.
      - id: notes
        name: Write the release notes
        run: node scripts/release.ts stable --commit="$COMMIT" --version="$VERSION" --notes="$RUNNER_TEMP/notes.md"
        env:
          COMMIT: ${{ needs.plan.outputs.commit }}
          VERSION: ${{ needs.plan.outputs.version }}
      # Each runner's packages in a folder of their own, then all in one, with the update files two
      # runners both wrote merged (scripts/merge-update-files.ts).
      - name: Fetch the packages
        if: ${{ steps.notes.outputs.publish == 'true' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: package-*
          path: ${{ runner.temp }}/packages
      - name: Gather the packages
        if: ${{ steps.notes.outputs.publish == 'true' }}
        run: node scripts/merge-update-files.ts "$RUNNER_TEMP/packages" apps/desktop/out
      - name: Fetch the web app
        if: ${{ steps.notes.outputs.publish == 'true' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web
          path: apps
      # Wrangler deploys the relay, which needs only the relay's own dependencies.
      - if: ${{ steps.notes.outputs.publish == 'true' }}
        uses: ./.github/actions/setup
        with:
          filter: "@cerium/relay"
      - name: Check the stable tag before deployment
        if: ${{ steps.notes.outputs.publish == 'true' }}
        env:
          TAG: ${{ steps.notes.outputs.tag }}
          COMMIT: ${{ needs.plan.outputs.commit }}
        run: |
          # Annotated tags report both the tag object and its peeled commit.
          refs=$(git ls-remote origin "refs/tags/$TAG" "refs/tags/$TAG^{}")
          target=$(awk '$2 ~ /\^\{\}$/ {peeled=$1; next} {oid=$1} END {print peeled ? peeled : oid}' <<<"$refs")
          if [[ -n "$target" && "$target" != "$COMMIT" ]]; then
            echo "::error::The stable tag already points to a different commit."
            exit 1
          fi
      - name: Deploy the relay
        if: ${{ steps.notes.outputs.publish == 'true' }}
        uses: ./.github/actions/deploy-relay
        with:
          version: ${{ needs.plan.outputs.version }}
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          github-token: ${{ github.token }}
      - id: tag
        name: Push the stable tag
        if: ${{ steps.notes.outputs.publish == 'true' }}
        env: *stable-tag-env
        run: *push-stable-tag
      - name: Publish
        if: ${{ steps.notes.outputs.publish == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.notes.outputs.tag }}
          TITLE: ${{ steps.notes.outputs.title }}
        run: |
          gh release create "$TAG" apps/desktop/out/* apps/relay/dist/cerium-web-*.tar.gz \
            --verify-tag --title "$TITLE" --notes-file "$RUNNER_TEMP/notes.md" --latest
      - name: Remove the tag if publication failed
        if: ${{ failure() && steps.tag.outputs.created == 'true' }}
        env: *stable-tag-env
        run: *rollback-stable-tag
