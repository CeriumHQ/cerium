name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  # Supersede build work only. A deployment already publishing its relay and desktop
  # release must finish as a unit even if another commit reaches main.
  build:
    name: Build and verify
    permissions:
      contents: write
      pull-requests: read
    concurrency:
      group: ${{ github.event_name == 'push' && 'ci-push-main' || format('ci-manual-{0}', github.run_id) }}
      cancel-in-progress: true
    uses: ./.github/workflows/ci-build.yml
    secrets:
      MAC_CERTIFICATE: ${{ secrets.MAC_CERTIFICATE }}
      MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

  # A push to main that changes the app publishes its nightly once everything passed: the relay
  # first, so it already reads what the new version sends, then the draft release the packages were
  # uploaded to, with the update files the runners share and the web UI, which installed apps update
  # from. Runs publish one at a time, oldest first, and one waiting behind another gives way to a
  # newer one, whose nightly carries its commits. The release plan is made again here, so a run that
  # finishes after a later push's publishes nothing (scripts/release.ts) and drops its draft.
  nightly-deploy:
    name: Nightly deployment
    needs: build
    if: ${{ github.event_name == 'push' && needs.build.outputs.publish == 'true' }}
    permissions:
      contents: write
    concurrency:
      group: publish-nightly
      cancel-in-progress: false
    uses: ./.github/workflows/nightly-publish.yml
    with:
      version: ${{ needs.build.outputs.version }}
      release: ${{ needs.build.outputs.release }}
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # Preserve the original check and report whether this commit actually published a nightly.
  publish:
    name: Publish the nightly
    needs: nightly-deploy
    if: ${{ !cancelled() && needs.nightly-deploy.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require successful deployment
        env:
          RESULT: ${{ needs.nightly-deploy.result }}
        run: test "$RESULT" = success
      - name: Publish the nightly
        if: ${{ needs.nightly-deploy.outputs.published == 'true' }}
        run: echo "The nightly was published."
