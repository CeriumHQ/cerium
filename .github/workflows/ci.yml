name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request cancels its running checks. A push to main runs once per commit:
# GitHub now and then delivers a push twice, and the second run replaces the first. Every commit
# pushed to main is checked and can publish its nightly; the publish job takes them one at a time.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('{0}-{1}', github.event_name, github.sha) }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  # Older nightlies are deleted, with their tags, once a newer one is published.
  NIGHTLIES_KEPT: 10

# The jobs run side by side, the packages without waiting for linting, which the pre-push hook has
# run already (scripts/pre-push.ts); publishing waits for every check and every package.
jobs:
  # The commit messages, whether anything but documentation changed, and the nightly's version, with
  # the draft release a push's nightly is gathered in.
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      package: ${{ steps.changes.outputs.package }}
      everywhere: ${{ steps.changes.outputs.everywhere }}
      windows: ${{ steps.changes.outputs.windows }}
      publish: ${{ steps.plan.outputs.publish }}
      version: ${{ steps.plan.outputs.version }}
      release: ${{ steps.draft.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit check and the release plan read the commits since the base and the release tags.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Check the commit messages
        run: node scripts/check-commits.ts "$BASE" "$HEAD"
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      # Commits that only change documentation, which no build reads, are checked but not packaged.
      # CHANGELOG.md belongs to the app: What's new shows it.
      - id: changes
        name: Find what changed
        run: |
          package=true
          everywhere=true
          if [ "$GITHUB_EVENT_NAME" != workflow_dispatch ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            changed=$(git diff --name-only "$BASE...$HEAD")
            app=$(grep -vE '\.md$|^LICENSE$|^\.github/(media|ISSUE_TEMPLATE)/' <<<"$changed" || true)
            changelog=$(grep -xF CHANGELOG.md <<<"$changed" || true)
            if [ -n "$changed" ] && [ -z "$app$changelog" ]; then
              package=false
              echo "Only documentation changed, so nothing is packaged or published."
            fi
            # A pull request packages only for Windows x64, the main platform, unless it changes the
            # desktop shell, the dependencies packages carry or how packages are built; main packages
            # everywhere before its nightly ships. The web UI bundles its dependencies into the same
            # JavaScript on every platform and the website's and the relay's aren't packaged, so a
            # lockfile that changed along with only their manifests leaves the packages as they were.
            packaging=$(grep -E '^apps/desktop/|^\.github/(actions/(setup|package)/|workflows/ci\.yml$)' <<<"$changed" || true)
            manifests=$(grep -E '(^|/)package\.json$' <<<"$changed" || true)
            carried=$(grep -vE '^apps/(ui|site|relay)/package\.json$' <<<"$manifests" || true)
            lockfile=$(grep -xF bun.lock <<<"$changed" || true)
            if [ -n "$carried" ] || { [ -n "$lockfile" ] && [ -z "$manifests" ]; }; then
              packaging+="$carried$lockfile"
            fi
            if [ "$GITHUB_EVENT_NAME" = pull_request ] && [ -z "$packaging" ]; then
              everywhere=false
              echo "Nothing that packaging reads changed, so only Windows x64 is packaged."
            fi
          fi
          if [ "$everywhere" = true ]; then
            windows='[{"arch":"x64","runner":"windows-latest"},{"arch":"Arm64","runner":"windows-11-arm"}]'
          else
            windows='[{"arch":"x64","runner":"windows-latest"}]'
          fi
          {
            echo "package=$package"
            echo "everywhere=$everywhere"
            echo "windows=$windows"
          } >> "$GITHUB_OUTPUT"
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      - id: plan
        name: Plan the nightly
        run: node scripts/release.ts nightly --build="$GITHUB_RUN_NUMBER"
      # Each package uploads to the nightly's draft as soon as it is built, which nobody but the
      # repository's writers sees until the publish job makes it public; publishing then took a minute
      # and more to fetch every package and upload it again. A rerun starts its draft afresh.
      - id: draft
        name: Start the nightly's draft release
        if: ${{ github.event_name == 'push' && steps.plan.outputs.publish == 'true' && steps.changes.outputs.package == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.plan.outputs.tag }}
          TITLE: ${{ steps.plan.outputs.title }}
          COMMIT: ${{ steps.plan.outputs.commit }}
        run: |
          while [ "$(gh release view "$TAG" --json isDraft --jq .isDraft 2> /dev/null)" = true ]; do
            gh release delete "$TAG" --yes
          done
          gh release create "$TAG" --draft --prerelease --target "$COMMIT" --title "$TITLE" --notes ""
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  # The platform-independent gates, once, on the fastest and cheapest runner. Each step after setup
  # runs even when an earlier one fails, so one run reports every problem.
  lint:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: setup
        uses: ./.github/actions/setup
      - name: Format and lint
        run: bun run check
      - name: Typecheck
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bun run typecheck
      # actionlint and zizmor; zizmor's online audits read the pinned actions with the job's token.
      - name: Lint the workflows
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bun run lint:workflows
        env:
          GH_TOKEN: ${{ github.token }}

  test-linux:
    name: Test (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # Ubuntu's AppArmor keeps unprivileged processes out of user namespaces, which Edge's sandbox
      # needs; the browser tests drive a real Edge.
      - name: Let Edge sandbox itself
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - id: test
        name: Test
        run: bun run test --run
        env:
          CERIUM_BROWSER_LOGS: ${{ runner.temp }}/browser-logs
      # Everything each browser printed, and a screenshot of a failing test's page.
      - name: Keep the browser's logs
        if: ${{ failure() && steps.test.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-logs-Linux
          path: ${{ runner.temp }}/browser-logs
          if-no-files-found: ignore
          retention-days: 7

  # Windows is the main platform: its tests cover paths and processes.
  test-windows:
    name: Test (Windows)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - id: test
        name: Test
        run: bun run test --run
        env:
          # The tests' temporary folders go on D:, the fast drive the checkout is on, under their full
          # name. C:'s temporary folder is slower, and named through the short RUNNER~1.
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          CERIUM_BROWSER_LOGS: ${{ runner.temp }}/browser-logs
      - name: Keep the browser's logs
        if: ${{ failure() && steps.test.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-logs-Windows
          path: ${{ runner.temp }}/browser-logs
          if-no-files-found: ignore
          retention-days: 7

  # This version's web UI and website, built once for the publish job to deploy and release.
  web:
    name: Build the web app
    needs: plan
    if: ${{ needs.plan.outputs.package == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/web
        with:
          version: ${{ needs.plan.outputs.version }}

  # Every change that reaches main is packaged and started on every platform, on each processor's
  # own runner, and a pull request on Windows x64 alone unless it touches packaging (plan, above).
  # Nightlies ship these packages, packed fast (.github/actions/package). Packaging installs neither
  # the relay's dependencies nor the website's, which its builds never read: Wrangler's alone brings
  # Cloudflare's runtime, about a hundred megabytes per platform. A push's packages upload straight to
  # its nightly's draft release (plan, above), which takes the write permission.
  package-linux:
    name: Package (Linux ${{ matrix.arch }})
    needs: plan
    if: ${{ needs.plan.outputs.package == 'true' && needs.plan.outputs.everywhere == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, runner: ubuntu-latest }
          - { arch: Arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          filter: "!@cerium/relay !@cerium/site"
      - uses: ./.github/actions/package
        with:
          version: ${{ needs.plan.outputs.version }}
          release: ${{ needs.plan.outputs.release }}
          github-token: ${{ github.token }}
          compression: fast
          # Only a push's nightly reports crashes; a pull request's packages only check the packaging.
          sentry-dsn: ${{ github.event_name == 'push' && vars.SENTRY_DSN || '' }}

  package-windows:
    name: Package (Windows ${{ matrix.arch }})
    needs: plan
    if: ${{ needs.plan.outputs.package == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.windows) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          filter: "!@cerium/relay !@cerium/site"
      - uses: ./.github/actions/package
        with:
          version: ${{ needs.plan.outputs.version }}
          release: ${{ needs.plan.outputs.release }}
          github-token: ${{ github.token }}
          compression: fast
          # Only a push's nightly reports crashes; a pull request's packages only check the packaging.
          sentry-dsn: ${{ github.event_name == 'push' && vars.SENTRY_DSN || '' }}

  # The Apple silicon and Intel Mac apps, both packaged on Apple silicon: an Intel runner took twice
  # as long and more, and the Intel app only needs Intel's native packages installed beside the
  # runner's (.github/actions/package). They run on the runner the repository's MAC_RUNNER variable
  # names, else the standard one. The larger macos-15-xlarge skips the minutes the standard one's
  # queue held them and halves both jobs, the Intel app's start through Rosetta most, but it is
  # billed by the minute, public repository or not, and a job for it isn't started while the
  # organization has no budget for it. The repository's Developer ID certificate and notarization
  # key sign the app when it has them, which a pull request from a fork never sees; without them it
  # is signed ad hoc.
  package-macos:
    name: Package (macOS ${{ matrix.arch }})
    needs: plan
    if: ${{ needs.plan.outputs.package == 'true' && needs.plan.outputs.everywhere == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: Arm64 }
          - { arch: x64, cross: x64 }
    runs-on: ${{ vars.MAC_RUNNER || 'macos-15' }}
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          filter: "!@cerium/relay !@cerium/site"
          cpu: ${{ matrix.cross && '*' || '' }}
      - uses: ./.github/actions/package
        with:
          version: ${{ needs.plan.outputs.version }}
          release: ${{ needs.plan.outputs.release }}
          github-token: ${{ github.token }}
          arch: ${{ matrix.cross }}
          compression: fast
          # Only a push's nightly reports crashes; a pull request's packages only check the packaging.
          sentry-dsn: ${{ github.event_name == 'push' && vars.SENTRY_DSN || '' }}
          mac-certificate: ${{ secrets.MAC_CERTIFICATE }}
          mac-certificate-password: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          apple-api-key: ${{ secrets.APPLE_API_KEY }}
          apple-api-key-id: ${{ secrets.APPLE_API_KEY_ID }}
          apple-api-issuer: ${{ secrets.APPLE_API_ISSUER }}

  # A push to main that changes the app publishes its nightly once everything passed: the relay
  # first, so it already reads what the new version sends, then the draft release the packages were
  # uploaded to, with the update files the runners share and the web UI, which installed apps update
  # from. Runs publish one at a time, oldest first, and one waiting behind another gives way to a
  # newer one, whose nightly carries its commits. The release plan is made again here, so a run that
  # finishes after a later push's publishes nothing (scripts/release.ts) and drops its draft.
  publish:
    name: Publish the nightly
    needs: [plan, lint, test-linux, test-windows, web, package-linux, package-windows, package-macos]
    if: ${{ github.event_name == 'push' && needs.plan.outputs.publish == 'true' && needs.plan.outputs.package == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: publish-nightly
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The release plan reads the release tags and the commits since them.
          fetch-depth: 0
          persist-credentials: false
      - id: replan
        name: Plan the nightly again
        run: node scripts/release.ts nightly --build="$GITHUB_RUN_NUMBER" --notes="$RUNNER_TEMP/notes.md"
      # The packages carry the version planned when the run began; a stable release since then moves
      # the nightly's.
      - id: plan
        name: Check the plan still holds
        run: |
          if [ "$PUBLISH" = true ] && [ "$VERSION" != "$PACKAGED" ]; then
            echo "::warning::A stable release moved this nightly from $PACKAGED to $VERSION since the run began, so the next push publishes instead."
            PUBLISH=false
          fi
          if [ "$PUBLISH" != true ] && [ -n "$RELEASE" ]; then gh release delete "$RELEASE" --yes || true; fi
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
        env:
          PUBLISH: ${{ steps.replan.outputs.publish }}
          VERSION: ${{ steps.replan.outputs.version }}
          PACKAGED: ${{ needs.plan.outputs.version }}
          RELEASE: ${{ needs.plan.outputs.release }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
      # Each runner's update files in a folder of their own, then all in one, with the ones two
      # runners both wrote merged (scripts/merge-update-files.ts).
      - name: Fetch the update files
        if: ${{ steps.plan.outputs.publish == 'true' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: update-files-*
          path: ${{ runner.temp }}/update-files
      - name: Merge the update files
        if: ${{ steps.plan.outputs.publish == 'true' }}
        run: node scripts/merge-update-files.ts "$RUNNER_TEMP/update-files" apps/desktop/out
      - name: Fetch the web app
        if: ${{ steps.plan.outputs.publish == 'true' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web
          path: apps
      # Wrangler deploys the relay, which needs only the relay's own dependencies.
      - if: ${{ steps.plan.outputs.publish == 'true' }}
        uses: ./.github/actions/setup
        with:
          filter: "@cerium/relay"
      - name: Deploy the relay
        if: ${{ steps.plan.outputs.publish == 'true' }}
        uses: ./.github/actions/deploy-relay
        with:
          version: ${{ steps.replan.outputs.version }}
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          github-token: ${{ github.token }}
      # Publishing the draft tags its commit.
      - name: Publish the nightly
        if: ${{ steps.plan.outputs.publish == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE: ${{ needs.plan.outputs.release }}
          TITLE: ${{ steps.replan.outputs.title }}
          COMMIT: ${{ steps.replan.outputs.commit }}
        run: |
          gh release upload "$RELEASE" apps/desktop/out/*.yml apps/relay/dist/cerium-web-*.tar.gz --clobber
          gh release edit "$RELEASE" --draft=false --prerelease --latest=false --target "$COMMIT" \
            --title "$TITLE" --notes-file "$RUNNER_TEMP/notes.md"
      # Drafts from runs that never published, which a later push's nightly replaced or a failed check
      # stopped, go once they are a few hours old, past any run still uploading to one.
      - name: Prune old nightlies
        if: ${{ steps.plan.outputs.publish == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release list --exclude-drafts --limit 200 --json tagName,isPrerelease,publishedAt \
            --jq '[.[] | select(.isPrerelease and (.tagName | test("-nightly[.]")))] | sort_by(.publishedAt) | reverse | .[].tagName' |
            tail -n +"$((NIGHTLIES_KEPT + 1))" |
            while read -r tag; do
              gh release delete "$tag" --cleanup-tag --yes || echo "::warning::Couldn't delete the nightly $tag"
            done
          gh release list --limit 200 --json tagName,isDraft,createdAt \
            --jq '.[] | select(.isDraft and (.tagName | test("-nightly[.]")) and (.createdAt | fromdateiso8601) < now - 6 * 3600) | .tagName' |
            while read -r tag; do
              gh release delete "$tag" --yes || echo "::warning::Couldn't delete the draft nightly $tag"
            done
