name: Test selection negative control
on: workflow_dispatch
permissions:
  contents: read

jobs:
  probe:
    name: A hidden title regression must fail the full suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Hide a production regression from a relay-only PR diff
        run: |
          node --input-type=module <<'JS'
          import assert from "node:assert/strict";
          import { readFileSync, writeFileSync, appendFileSync } from "node:fs";
          import { selectedTests } from "./scripts/ci-tests.ts";
          const filters = selectedTests("M\0apps/relay/src/limits.ts\0");
          assert.deepEqual(filters, ["apps/relay/test/"]);
          appendFileSync(process.env.GITHUB_ENV, `TEST_FILTERS=${JSON.stringify(filters)}\n`);
          const file = "packages/orchestrator/src/titles.ts";
          const original = readFileSync(file, "utf8");
          const broken = original.replace("return title;", 'return "hidden regression";');
          assert.notEqual(broken, original);
          writeFileSync(file, broken);
          JS
      - name: Run the selected PR command
        run: env GITHUB_EVENT_NAME=pull_request node scripts/ci-tests.ts
      - name: Run the queue command with the same hidden diff
        run: env GITHUB_EVENT_NAME=merge_group node scripts/ci-tests.ts
