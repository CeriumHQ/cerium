name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request cancels its running checks. A push to main runs once per commit:
# GitHub now and then delivers a push twice, and the second run replaces the first. Every commit
# pushed to main is checked and can publish its nightly; the publish job takes them one at a time.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('{0}-{1}', github.event_name, github.sha) }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

# The jobs run side by side, the packages without waiting for linting, which the pre-push hook has
# run already (scripts/pre-push.ts); publishing waits for every check and every package. A PR
# that only changes documentation is linted. The queue and main run the whole suite.
jobs:
  # The commit messages, whether anything but documentation changed, and the nightly's version, with
  # the draft release a push's nightly is gathered in.
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      package: ${{ github.event_name != 'pull_request' || steps.changes.outputs.package == 'true' }}
      everywhere: ${{ steps.changes.outputs.everywhere }}
      tests: ${{ steps.tests.outputs.tests }}
      windows: ${{ steps.changes.outputs.windows }}
      installer: ${{ steps.changes.outputs.installer }}
      publish: ${{ steps.plan.outputs.publish == 'true' && steps.changes.outputs.package == 'true' }}
      version: ${{ steps.plan.outputs.version }}
      release: ${{ steps.draft.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit check and the release plan read the commits since the base and the release tags.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Check the commit messages
        run: node scripts/check-commits.ts "$BASE" "$HEAD"
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      # Commits that only change documentation, which no build reads, are linted but neither tested
      # nor packaged.
      # CHANGELOG.md belongs to the app: What's new shows it.
      - id: changes
        name: Find what changed
        run: |
          package=true
          installer=true
          everywhere=true
          if [ "$GITHUB_EVENT_NAME" != merge_group ] && [ "$GITHUB_EVENT_NAME" != workflow_dispatch ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            changed=$(git diff --name-only "$BASE...$HEAD")
            app=$(grep -vE '\.md$|^LICENSE$|^\.github/(media|ISSUE_TEMPLATE)/' <<<"$changed" || true)
            changelog=$(grep -xF CHANGELOG.md <<<"$changed" || true)
            if [ -n "$changed" ] && [ -z "$app$changelog" ]; then
              package=false
              echo "Only documentation changed, so nothing is packaged or published."
            fi
            # A pull request packages only for Windows x64, the main platform, unless it changes the
            # desktop shell, the dependencies packages carry or how packages are built; main packages
            # everywhere before its nightly ships. The web UI bundles its dependencies into the same
            # JavaScript on every platform and the website's and the relay's aren't packaged, so a
            # lockfile that changed along with only their manifests leaves the packages as they were.
            packaging=$(grep -E '^apps/desktop/|^\.github/(actions/(setup|package|react-compiler-cache)/|workflows/ci\.yml$)' <<<"$changed" || true)
            manifests=$(grep -E '(^|/)package\.json$' <<<"$changed" || true)
            carried=$(grep -vE '^apps/(ui|site|relay)/package\.json$' <<<"$manifests" || true)
            lockfile=$(grep -xF bun.lock <<<"$changed" || true)
            if [ -n "$carried" ] || { [ -n "$lockfile" ] && [ -z "$manifests" ]; }; then
              packaging+="$carried$lockfile"
            fi
            if [ "$GITHUB_EVENT_NAME" = pull_request ] && [ -z "$packaging" ]; then
              everywhere=false
              # Site and relay code is built and checked in the web job. Neither workspace is
              # installed by the desktop packager. Keep both sides of moves in the comparison.
              if git diff --quiet --no-renames "$BASE...$HEAD" -- . \
                ':(exclude)apps/site/src/**' ':(exclude)apps/site/public/**' \
                ':(exclude)apps/relay/src/**' ':(exclude)apps/relay/public/**' ':(exclude)apps/relay/test/**'; then
                installer=false
                echo "Only site or relay files changed. The queue will check every installer."
              else
                status=$?
                [ "$status" = 1 ] || exit "$status"
                echo "Only Windows x64 is packaged for this PR."
              fi
            fi
          fi
          if [ "$everywhere" = true ]; then
            windows='[{"arch":"x64","runner":"windows-latest"},{"arch":"Arm64","runner":"windows-11-arm"}]'
          else
            windows='[{"arch":"x64","runner":"windows-latest"}]'
          fi
          {
            echo "package=$package"
            echo "everywhere=$everywhere"
            echo "windows=$windows"
            echo "installer=$installer"
          } >> "$GITHUB_OUTPUT"
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      - id: tests
        name: Select PR tests
        run: node scripts/ci-tests.ts plan
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
      - id: plan
        name: Plan the nightly
        run: node scripts/release.ts nightly --build="$GITHUB_RUN_NUMBER"
      # Each package uploads to the nightly's draft as soon as it is built, which nobody but the
      # repository's writers sees until the publish job makes it public; publishing then took a minute
      # and more to fetch every package and upload it again. A rerun starts its draft afresh.
      - id: draft
        name: Start the nightly's draft release
        if: ${{ github.event_name == 'push' && steps.plan.outputs.publish == 'true' && steps.changes.outputs.package == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.plan.outputs.tag }}
          TITLE: ${{ steps.plan.outputs.title }}
          COMMIT: ${{ steps.plan.outputs.commit }}
        run: |
          while [ "$(gh release view "$TAG" --json isDraft --jq .isDraft 2> /dev/null)" = true ]; do
            gh release delete "$TAG" --yes
          done
          gh release create "$TAG" --draft --prerelease --target "$COMMIT" --title "$TITLE" --notes ""
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  # The platform-independent gates, once, on the fastest and cheapest runner. Each step after setup
  # runs even when an earlier one fails, so one run reports every problem.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: setup
        uses: ./.github/actions/setup
      - name: Format and lint
        run: bun run check
      # actionlint and zizmor; zizmor's online audits read the pinned actions with the job's token.
      - name: Lint the workflows
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bun run lint:workflows
        env:
          GH_TOKEN: ${{ github.token }}

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: bun run typecheck

  test-linux:
    name: Test (Linux)
    needs: plan
    if: ${{ needs.plan.outputs.package == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # Ubuntu's AppArmor keeps unprivileged processes out of user namespaces, which Edge's sandbox
      # needs; the browser tests drive a real Edge.
      - name: Let Edge sandbox itself
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - id: test
        name: Test
        run: node scripts/ci-tests.ts
        env:
          TEST_FILTERS: ${{ needs.plan.outputs.tests }}
          CERIUM_BROWSER_LOGS: ${{ runner.temp }}/browser-logs
      # Everything each browser printed, and a screenshot of a failing test's page.
      - name: Keep the browser's logs
        if: ${{ failure() && steps.test.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-logs-Linux
          path: ${{ runner.temp }}/browser-logs
          if-no-files-found: ignore
          retention-days: 7

  test-windows:
    name: Test (Windows)
    needs: plan
    if: ${{ needs.plan.outputs.package == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - id: test
        name: Test
        run: node scripts/ci-tests.ts
        env:
          TEST_FILTERS: ${{ needs.plan.outputs.tests }}
          # Use the fast checkout drive and the long path (C:'s temporary path contains RUNNER~1).
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          CERIUM_BROWSER_LOGS: ${{ runner.temp }}/browser-logs
      - name: Keep the browser's logs
        if: ${{ failure() && steps.test.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-logs-Windows
          path: ${{ runner.temp }}/browser-logs
          if-no-files-found: ignore
          retention-days: 7

  # macOS: its own shells, case-insensitive disk and processes, on the standard Apple silicon runner,
  # wherever the Mac apps are packaged.
  # It doesn't hold back the nightly yet: the packaged Mac app's smoke test does
  # (.github/actions/package), until this has a record of passing.
  test-macos:
    name: Test (macOS)
    needs: plan
    if: ${{ needs.plan.outputs.package == 'true' && needs.plan.outputs.everywhere == 'true' }}
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - id: test
        name: Test
        run: node scripts/ci-tests.ts
        env:
          TEST_FILTERS: ${{ needs.plan.outputs.tests }}
          CERIUM_BROWSER_LOGS: ${{ runner.temp }}/browser-logs
      - name: Keep the browser's logs
        if: ${{ failure() && steps.test.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-logs-macOS
          path: ${{ runner.temp }}/browser-logs
          if-no-files-found: ignore
          retention-days: 7

  # This version's web UI and website, built once for the publish job to deploy and release.
  web:
    name: Build the web app
    needs: plan
    if: ${{ needs.plan.outputs.package == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/web
        with:
          version: ${{ needs.plan.outputs.version }}

  # Every change that reaches main is packaged and started on every platform, on each processor's
  # own runner, and a pull request on Windows x64 alone unless it touches packaging (plan, above).
  # Nightlies ship these packages, their Linux ones compressed on every core; a pull request's are
  # only checked, and packed fast (.github/actions/package). Packaging installs neither
  # the relay's dependencies nor the website's, which its builds never read: Wrangler's alone brings
  # Cloudflare's runtime, about a hundred megabytes per platform. A push's packages upload straight to
  # its nightly's draft release (plan, above), which takes the write permission.
  package-linux:
    name: Package (Linux ${{ matrix.target.arch }}${{ matrix.locales == 'english' && ', English' || '' }})
    needs: plan
    if: ${{ needs.plan.outputs.package == 'true' && needs.plan.outputs.everywhere == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        locales: [full, english]
        target:
          - { arch: x64, runner: ubuntu-latest }
          - { arch: Arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.target.runner }}
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          filter: "!@cerium/relay !@cerium/site"
      - uses: ./.github/actions/package
        with:
          version: ${{ needs.plan.outputs.version }}
          release: ${{ needs.plan.outputs.release }}
          github-token: ${{ github.token }}
          compression: ${{ needs.plan.outputs.release != '' && 'balanced' || 'fast' }}
          chromium-locales: ${{ matrix.locales }}
          # Only a push's nightly reports crashes; a pull request's packages only check the packaging.
          sentry-dsn: ${{ github.event_name == 'push' && vars.SENTRY_DSN || '' }}

  package-windows:
    name: Package (Windows ${{ matrix.target.arch }}${{ matrix.locales == 'english' && ', English' || '' }})
    needs: plan
    if: ${{ needs.plan.outputs.package == 'true' && needs.plan.outputs.installer == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        locales: ${{ fromJSON(needs.plan.outputs.everywhere == 'true' && '["full","english"]' || '["full"]') }}
        target: ${{ fromJSON(needs.plan.outputs.windows) }}
    runs-on: ${{ matrix.target.runner }}
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          filter: "!@cerium/relay !@cerium/site"
      - uses: ./.github/actions/package
        with:
          version: ${{ needs.plan.outputs.version }}
          release: ${{ needs.plan.outputs.release }}
          github-token: ${{ github.token }}
          compression: ${{ needs.plan.outputs.release != '' && 'balanced' || 'fast' }}
          chromium-locales: ${{ matrix.locales }}
          # Only a push's nightly reports crashes; a pull request's packages only check the packaging.
          sentry-dsn: ${{ github.event_name == 'push' && vars.SENTRY_DSN || '' }}

  # Both Mac apps are built and smoke-tested on their own processor's standard hosted runner.
  # Apple silicon builds once and packages both locale sets, halving its use of the scarce macos-15
  # runner; Intel keeps one job per set, at ~2.5x slower it would become the run's longest job.
  package-macos:
    name: Package (macOS ${{ matrix.arch }}${{ matrix.locales == 'english' && ', English' || matrix.locales == 'both' && ', full and English' || '' }})
    needs: plan
    if: ${{ needs.plan.outputs.package == 'true' && needs.plan.outputs.everywhere == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: Arm64, runner: macos-15, locales: both }
          - { arch: x64, runner: macos-15-intel, locales: full }
          - { arch: x64, runner: macos-15-intel, locales: english }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          filter: "!@cerium/relay !@cerium/site"
      - uses: ./.github/actions/package
        with:
          version: ${{ needs.plan.outputs.version }}
          release: ${{ needs.plan.outputs.release }}
          github-token: ${{ github.token }}
          compression: ${{ needs.plan.outputs.release != '' && 'balanced' || 'fast' }}
          chromium-locales: ${{ matrix.locales }}
          # Only a push's nightly reports crashes; a pull request's packages only check the packaging.
          sentry-dsn: ${{ github.event_name == 'push' && vars.SENTRY_DSN || '' }}
          mac-certificate: ${{ github.event_name != 'pull_request' && github.event_name != 'merge_group' && secrets.MAC_CERTIFICATE || '' }}
          mac-certificate-password: ${{ github.event_name != 'pull_request' && github.event_name != 'merge_group' && secrets.MAC_CERTIFICATE_PASSWORD || '' }}
          apple-api-key: ${{ github.event_name != 'pull_request' && github.event_name != 'merge_group' && secrets.APPLE_API_KEY || '' }}
          apple-api-key-id: ${{ github.event_name != 'pull_request' && github.event_name != 'merge_group' && secrets.APPLE_API_KEY_ID || '' }}
          apple-api-issuer: ${{ github.event_name != 'pull_request' && github.event_name != 'merge_group' && secrets.APPLE_API_ISSUER || '' }}

  # A single required status covers the variable package matrices. A skipped or cancelled
  # dependency in the queue must block the merge, including when the plan itself failed.
  queue-suite:
    name: Full merge suite
    if: ${{ always() && (github.event_name == 'merge_group' || github.event_name == 'pull_request') }}
    needs:
      [
        plan,
        lint,
        typecheck,
        test-linux,
        test-windows,
        test-macos,
        web,
        package-linux,
        package-windows,
        package-macos,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Require every suite to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          jq -e --arg event "$GITHUB_EVENT_NAME" '
            .plan.outputs as $plan |
            to_entries | all(.[];
              (if $event == "merge_group" or .key == "plan" or .key == "lint" or .key == "typecheck" then "success"
               elif $plan.package != "true" then "skipped"
               elif .key == "package-windows" and $plan.installer == "false" then "skipped"
               elif $plan.everywhere != "true" and (.key == "test-macos" or .key == "package-linux" or .key == "package-macos") then "skipped"
               else "success" end) == .value.result)
          ' <<<"$RESULTS"

  # A push to main that changes the app publishes its nightly once everything passed: the relay
  # first, so it already reads what the new version sends, then the draft release the packages were
  # uploaded to, with the update files the runners share and the web UI, which installed apps update
  # from. Runs publish one at a time, oldest first, and one waiting behind another gives way to a
  # newer one, whose nightly carries its commits. The release plan is made again here, so a run that
  # finishes after a later push's publishes nothing (scripts/release.ts) and drops its draft.
  nightly-deploy:
    name: Nightly deployment
    needs:
      [plan, lint, typecheck, test-linux, test-windows, web, package-linux, package-windows, package-macos]
    if: ${{ github.event_name == 'push' && needs.plan.outputs.publish == 'true' && needs.plan.outputs.package == 'true' }}
    permissions:
      contents: write
    concurrency:
      group: publish-nightly
      cancel-in-progress: false
    uses: ./.github/workflows/nightly-publish.yml
    with:
      version: ${{ needs.plan.outputs.version }}
      release: ${{ needs.plan.outputs.release }}
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # Preserve the original check and report whether this commit actually published a nightly.
  publish:
    name: Publish the nightly
    needs: nightly-deploy
    if: ${{ !cancelled() && needs.nightly-deploy.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require successful deployment
        env:
          RESULT: ${{ needs.nightly-deploy.result }}
        run: test "$RESULT" = success
      - name: Publish the nightly
        if: ${{ needs.nightly-deploy.outputs.published == 'true' }}
        run: echo "The nightly was published."
