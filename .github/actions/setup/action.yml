name: Set up the workspace
description: >-
  Installs Bun, Node 24, and the selected workspace dependencies from the frozen lockfile.
  On Windows it first configures Defender for the job.

inputs:
  filter:
    description: >-
      Installs only the dependencies of the workspace packages these space-separated patterns match
      (`bun install --filter`, where `!` leaves a package out), for a job that runs only some
      packages' scripts. Desktop packaging can use `!@cerium/relay !@cerium/site`. Empty installs the
      whole workspace.
    required: false
    default: ""
  cpu:
    description: >-
      Installs the native packages built for these processors too (`bun install --cpu`, `*` for
      all), for a job that packages the app for a processor other than the runner's. Empty installs
      the runner's own.
    required: false
    default: ""

runs:
  using: composite
  steps:
    # Defender scans every file a process opens and every program that starts, which slows installing,
    # building, packaging and the thousands of git processes the tests start. The runner is a fresh
    # machine that lasts one job. Where scanning can't be turned off, the checkout and the temporary
    # folder are left out of it instead.
    - name: Configure Defender
      if: runner.os == 'Windows' && runner.arch != 'ARM64'
      shell: pwsh
      run: |
        try {
          Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionPath $env:GITHUB_WORKSPACE, $env:RUNNER_TEMP -ErrorAction SilentlyContinue
          "Defender real-time scanning: $((Get-MpComputerStatus).RealTimeProtectionEnabled)"
        } catch {
          "Defender left as it was: $_"
        }

    # Windows on Arm's runners keep real-time scanning on, so only the path exclusions apply there.
    # Adding them took about 40 seconds of every job, on the runner whose jobs finish last, so a
    # process of its own adds them while Bun and Node are set up and the install begins. Started
    # this way it has a hidden window of its own and none of this step's handles, so the step ends
    # at once and the process runs on.
    - name: Configure Defender in the background
      if: runner.os == 'Windows' && runner.arch == 'ARM64'
      shell: pwsh
      run: |
        try {
          $command = "Add-MpPreference -ExclusionPath '$env:GITHUB_WORKSPACE', '$env:RUNNER_TEMP' -ErrorAction SilentlyContinue"
          $encoded = [Convert]::ToBase64String([Text.Encoding]::Unicode.GetBytes($command))
          Start-Process -FilePath pwsh -WindowStyle Hidden `
            -ArgumentList '-NoProfile', '-NonInteractive', '-EncodedCommand', $encoded
        } catch {
          "Defender left as it was: $_"
        }

    # Bun is the package manager only; the version comes from package.json's packageManager field.
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

    # Code runs on Node 24, the Node that Electron bundles in production.
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24

    # Installing also runs the root `prepare` script, which patches the Effect diagnostics into
    # TypeScript and Oxlint.
    - name: Install dependencies and run prepare
      shell: bash
      run: |
        read -ra patterns <<<"$FILTER"
        filters=()
        for pattern in "${patterns[@]}"; do filters+=(--filter "$pattern"); done
        bun install --frozen-lockfile "${filters[@]}" ${CPU:+--cpu="$CPU"}
      env:
        FILTER: ${{ inputs.filter }}
        CPU: ${{ inputs.cpu }}
        # Hosted Windows runners put the checkout and runner.temp on the same drive (C: on Arm64,
        # D: on x64 in recent runs). Bun can hard-link within that drive. Keep the cache job-local:
        # restoring the extracted package cache took longer than downloading packages again.
        BUN_INSTALL_CACHE_DIR: ${{ runner.temp }}/bun-cache
        # CI only starts packaged builds, whose Electron electron-builder fetches itself, so the
        # development binary's download is skipped.
        ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
