name: Set up the workspace
description: Installs Bun and Node 24, then the workspace's dependencies from the frozen lockfile.

runs:
  using: composite
  steps:
    # Bun is the package manager only; the version comes from package.json's packageManager field.
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

    # Code runs on Node 24, the Node that Electron bundles in production.
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24

    # Bun's package cache goes on the checkout's disk. Its default home on Windows is on C:, which is
    # much slower than the D: the checkout is on, and Bun can't hard-link packages across the two, so
    # installing there took several times as long. The cache isn't kept between runs: restoring it took
    # longer than downloading the packages again, on Windows several times longer.
    - shell: bash
      run: echo "BUN_INSTALL_CACHE_DIR=$RUNNER_TEMP/bun-cache" >> "$GITHUB_ENV"

    # Installing also runs the root `prepare` script, which patches the Effect diagnostics into
    # TypeScript and Oxlint.
    - shell: bash
      run: bun install --frozen-lockfile
      env:
        # Nothing in CI starts Electron, so its binary download is skipped.
        ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
