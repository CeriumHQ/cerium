name: Set up the workspace
description: >-
  Installs Bun and Node 24, then the workspace's dependencies from the frozen lockfile, or only some
  packages'. On Windows it first turns off Defender's real-time scanning.

inputs:
  filter:
    description: >-
      Installs only the dependencies of the workspace packages these space-separated patterns match
      (`bun install --filter`, where `!` leaves a package out), for a job that runs only some
      packages' scripts. Empty installs the whole workspace.
    required: false
    default: ""
  cpu:
    description: >-
      Installs the native packages built for these processors too (`bun install --cpu`, `*` for
      all), for a job that packages the app for a processor other than the runner's. Empty installs
      the runner's own.
    required: false
    default: ""

runs:
  using: composite
  steps:
    # Defender scans every file a process opens and every program that starts, which slows installing,
    # building, packaging and the thousands of git processes the tests start. The runner is a fresh
    # machine that lasts one job. Where scanning can't be turned off, the checkout and the temporary
    # folder are left out of it instead. Windows on Arm's runners never let it be turned off, and
    # asking took over half a minute there, so they only get the exclusions.
    - if: runner.os == 'Windows'
      shell: pwsh
      run: |
        try {
          if ($env:RUNNER_ARCH -ne 'ARM64') {
            Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction SilentlyContinue
          }
          Add-MpPreference -ExclusionPath $env:GITHUB_WORKSPACE, $env:RUNNER_TEMP -ErrorAction SilentlyContinue
          "Defender real-time scanning: $((Get-MpComputerStatus).RealTimeProtectionEnabled)"
        } catch {
          "Defender left as it was: $_"
        }

    # Bun is the package manager only; the version comes from package.json's packageManager field.
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

    # Code runs on Node 24, the Node that Electron bundles in production.
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24

    # Installing also runs the root `prepare` script, which patches the Effect diagnostics into
    # TypeScript and Oxlint.
    - shell: bash
      run: |
        read -ra patterns <<<"$FILTER"
        filters=()
        for pattern in "${patterns[@]}"; do filters+=(--filter "$pattern"); done
        bun install --frozen-lockfile "${filters[@]}" ${CPU:+--cpu="$CPU"}
      env:
        FILTER: ${{ inputs.filter }}
        CPU: ${{ inputs.cpu }}
        # Bun's package cache goes on the checkout's disk. Its default home on Windows is on C:, which
        # is much slower than the D: the checkout is on, and Bun can't hard-link packages across the
        # two, so installing there took several times as long. The cache isn't kept between runs:
        # restoring it took longer than downloading the packages again, on Windows several times longer.
        BUN_INSTALL_CACHE_DIR: ${{ runner.temp }}/bun-cache
        # CI only starts packaged builds, whose Electron electron-builder fetches itself, so the
        # development binary's download is skipped.
        ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
