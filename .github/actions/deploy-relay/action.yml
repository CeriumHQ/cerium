name: Deploy the relay
description: >-
  Deploys the relay with this version's web UI and website, which the `web` artifact brings
  (.github/actions/web), and earlier releases' web UI builds. Runs before the installers are
  published, so the relay already reads what the new version sends. Without a Cloudflare token it
  warns and deploys nothing.

inputs:
  version:
    description: The version being released, from scripts/release.ts.
    required: true
  cloudflare-api-token:
    description: A Cloudflare API token that may deploy Workers.
    required: false
    default: ""
  cloudflare-account-id:
    description: The Cloudflare account the relay belongs to.
    required: false
    default: ""
  github-token:
    description: Reads earlier releases' web UI builds.
    required: true

runs:
  using: composite
  steps:
    - name: Deploy
      shell: bash
      run: |
        if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
          echo "::warning::CLOUDFLARE_API_TOKEN isn't set, so the relay wasn't deployed with $VERSION's web UI."
          exit 0
        fi
        if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then unset CLOUDFLARE_ACCOUNT_ID; fi
        bun run --cwd apps/relay builds
        cd apps/relay && bun x wrangler deploy
      env:
        VERSION: ${{ inputs.version }}
        CLOUDFLARE_API_TOKEN: ${{ inputs.cloudflare-api-token }}
        CLOUDFLARE_ACCOUNT_ID: ${{ inputs.cloudflare-account-id }}
        GH_TOKEN: ${{ inputs.github-token }}
        GH_REPO: ${{ github.repository }}
