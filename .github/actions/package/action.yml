name: Package the app
description: >-
  Builds and smoke-tests the native desktop package and uploads release assets when requested.

inputs:
  version:
    description: The version the package carries, from scripts/release.ts.
    required: true
  compression:
    description: >-
      Use maximum for shipped packages and fast for check-only packages.
    required: true
  upload-artifact:
    description: Store the installers for a subsequent stable release job.
    default: "false"
    required: false
  release:
    description: >-
      The tag of the draft release a push's nightly is gathered in (.github/workflows/ci.yml), to
      upload the packages to while the smoke test runs, so publishing only adds the update files the
      runners share and makes the release public. Empty leaves them local unless upload-artifact is enabled.
    required: false
    default: ""
  github-token:
    description: A token that may upload to the draft release; only the upload sees it.
    required: false
    default: ""
  sentry-dsn:
    description: >-
      Where the packaged app sends its anonymous crash reports (apps/desktop/src/crashReports.ts),
      the repository's SENTRY_DSN variable; without one the app sends none.
    required: false
    default: ""
  mac-certificate:
    description: The Developer ID Application certificate and its key, a base64 .p12 (macOS only).
    required: false
    default: ""
  mac-certificate-password:
    description: The .p12's password.
    required: false
    default: ""
  apple-api-key:
    description: An App Store Connect API key (.p8 contents) that notarizes the signed app.
    required: false
    default: ""
  apple-api-key-id:
    description: The API key's ID.
    required: false
    default: ""
  apple-api-issuer:
    description: The API key's issuer ID.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - id: react-compiler-cache
      uses: ./.github/actions/react-compiler-cache
      with:
        mode: desktop

    - name: Build
      shell: bash
      run: |
        bun run build:desktop
        if compgen -G 'apps/ui/dist/assets/ort-wasm-*.wasm' > /dev/null; then
          echo "::error::ONNX WebAssembly was bundled into the desktop UI."
          exit 1
        fi
      env:
        CERIUM_VERSION: ${{ inputs.version }}
        CERIUM_SENTRY_DSN: ${{ inputs.sentry-dsn }}
        CERIUM_OPTIONAL_DICTATION: "1"
        CERIUM_REACT_COMPILER_CACHE: ${{ steps.react-compiler-cache.outputs.file }}

    - name: Save the React compiler cache
      if: steps.react-compiler-cache.outputs.save-key != ''
      continue-on-error: true
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.react-compiler-cache.outputs.file }}
        key: ${{ steps.react-compiler-cache.outputs.save-key }}

    # electron-builder downloads Electron, NSIS and the AppImage tools into these folders.
    # A pull request restores them but saves nothing: its cache entry would only evict main's.
    - id: electron-builder-cache
      if: env.CERIUM_STABLE_CANDIDATE != 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/AppData/Local/electron/Cache
          ~/AppData/Local/electron-builder/Cache
          ~/.cache/electron
          ~/.cache/electron-builder
          ~/Library/Caches/electron
          ~/Library/Caches/electron-builder
        key: electron-builder-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('apps/desktop/package.json') }}

    # The patched Windows packager builds its uninstaller in a separate executable, so makensis
    # can write the final installer while the first executable is still locked. On macOS it signs with
    # the certificate in CSC_LINK and notarizes with the key file APPLE_API_KEY names; without them
    # it signs ad hoc (apps/desktop/electron-builder.ts). A pull request's build (GITHUB_BASE_REF set)
    # always signs ad hoc, which takes no secret. electron-builder signs nothing for one unless
    # CSC_FOR_PULL_REQUEST says to, which left Electron's own signature on a bundle it no longer
    # matched and the smoke test's codesign check refused it.
    - name: Package
      shell: bash
      run: |
        case "$COMPRESSION" in
          fast) export ELECTRON_BUILDER_COMPRESSION_LEVEL=1 ;;
          maximum) ;;
          *)
            echo "::error::compression is '$COMPRESSION', not fast or maximum."
            exit 1
            ;;
        esac
        if [ "$RUNNER_OS" = macOS ] && { [ -n "${GITHUB_BASE_REF:-}" ] || [ "$GITHUB_EVENT_NAME" = merge_group ]; }; then
          export CSC_FOR_PULL_REQUEST=true
        elif [ "$RUNNER_OS" = macOS ] && [ -n "$MAC_CERTIFICATE" ]; then
          export CSC_LINK="$MAC_CERTIFICATE" CSC_KEY_PASSWORD="$MAC_CERTIFICATE_PASSWORD"
          if [ -n "$APPLE_API_KEY_CONTENTS" ]; then
            printf '%s' "$APPLE_API_KEY_CONTENTS" > "$RUNNER_TEMP/apple-api-key.p8"
            export APPLE_API_KEY="$RUNNER_TEMP/apple-api-key.p8"
          fi
        fi
        # electron-builder refuses half a notarization key.
        if [ -z "${APPLE_API_KEY:-}" ]; then unset APPLE_API_KEY_ID APPLE_API_ISSUER; fi
        bun run --cwd apps/desktop package
        if [ "$CERIUM_CHECK_ONLY" = true ] && compgen -G 'apps/desktop/out/*.blockmap' > /dev/null; then
          echo "::error::Check-only packaging generated a release blockmap."
          exit 1
        fi
      env:
        CERIUM_VERSION: ${{ inputs.version }}
        COMPRESSION: ${{ inputs.compression }}
        CERIUM_CHECK_ONLY: ${{ inputs.compression == 'fast' && inputs.release == '' && inputs.upload-artifact != 'true' && env.CERIUM_STABLE_CANDIDATE != 'true' }}
        MAC_CERTIFICATE: ${{ inputs.mac-certificate }}
        MAC_CERTIFICATE_PASSWORD: ${{ inputs.mac-certificate-password }}
        APPLE_API_KEY_CONTENTS: ${{ inputs.apple-api-key }}
        APPLE_API_KEY_ID: ${{ inputs.apple-api-key-id }}
        APPLE_API_ISSUER: ${{ inputs.apple-api-issuer }}

    - name: Save the electron-builder cache
      if: env.CERIUM_STABLE_CANDIDATE != 'true' && github.event_name != 'pull_request' && steps.electron-builder-cache.outputs.cache-hit != 'true'
      continue-on-error: true
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/AppData/Local/electron/Cache
          ~/AppData/Local/electron-builder/Cache
          ~/.cache/electron
          ~/.cache/electron-builder
          ~/Library/Caches/electron
          ~/Library/Caches/electron-builder
        key: electron-builder-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('apps/desktop/package.json') }}

    # Start the installed Windows app, mounted Mac disk image or extracted Linux AppImage.
    - name: Smoke test
      shell: bash
      run: |
        out=apps/desktop/out
        export CERIUM_SMOKE_LOCALE=fr
        # The WebAssembly is identical across platforms. Publish it from one runner, which also
        # runs when a pull request only packages for Windows x64.
        runtime=()
        if [ "$RUNNER_OS" = Windows ] && [ "$RUNNER_ARCH" = X64 ]; then
          asset="cerium-dictation-$VERSION.wasm"
          cp "apps/ui/dist/$asset" "$out/$asset"
          runtime=("$out/$asset")
        fi
        case "$RUNNER_OS" in
          Linux) packages=("$out/Cerium-$VERSION-x86_64.AppImage") ;;
          Windows) packages=("$out/Cerium-Setup-$VERSION-x64.exe" "${runtime[@]}") ;;
          macOS) packages=("$out/Cerium-$VERSION-arm64.dmg" "$out/Cerium-$VERSION-arm64-mac.zip") ;;
          *) exit 1 ;;
        esac
        if [ "$COMPRESSION" = maximum ]; then
          channel=latest
          if [[ "$VERSION" == *-nightly.* ]]; then channel=nightly; fi
          case "$RUNNER_OS" in
            Windows)
              packages+=("$out/Cerium-Setup-$VERSION-x64.exe.blockmap")
              feed="$out/$channel.yml"
              ;;
            macOS)
              packages+=("$out/Cerium-$VERSION-arm64-mac.zip.blockmap")
              feed="$out/$channel-mac.yml"
              ;;
            Linux) feed="$out/$channel-linux.yml" ;;
          esac
          if ! grep -Fxq "version: $VERSION" "$feed"; then
            echo "::error::Expected update feed $feed for $VERSION."
            exit 1
          fi
        fi
        for file in "${packages[@]}"; do
          if [ ! -s "$file" ]; then echo "::error::Missing package output: $file"; exit 1; fi
        done
        if [ -n "$RELEASE" ]; then
          GH_TOKEN="$UPLOAD_TOKEN" gh release upload "$RELEASE" "${packages[@]}" --clobber \
            > "$RUNNER_TEMP/upload.log" 2>&1 &
          upload=$!
        fi
        unset UPLOAD_TOKEN
        smoke() {
          local report="$RUNNER_TEMP/smoke-test/$1"
          shift
          "$@" --smoke-test="$report" || {
            local status=$?
            cat "$report/smoke-test.log" 2>/dev/null || echo "The app wrote no report."
            exit "$status"
          }
        }
        if [ "$RUNNER_OS" = Windows ]; then
          installers=("$out"/*.exe)
          export CERIUM_SMOKE_INSTALLER
          CERIUM_SMOKE_INSTALLER="$(cygpath -aw "${installers[0]}")"
          # shellcheck disable=SC2016 # PowerShell expands these variables.
          powershell.exe -NoProfile -NonInteractive -Command '
            $ErrorActionPreference = "Stop"
            $directory = Join-Path $env:RUNNER_TEMP "cerium-installed"
            $temporary = Join-Path $env:RUNNER_TEMP "cerium-installer"
            New-Item -ItemType Directory -Force $temporary | Out-Null
            $env:TEMP = $env:TMP = $temporary
            $installer = Start-Process -FilePath $env:CERIUM_SMOKE_INSTALLER -Wait -PassThru `
              -ArgumentList "/S", "/currentuser", "/D=$directory"
            exit $installer.ExitCode
          '
          smoke installer "$(cygpath -u "$RUNNER_TEMP")/cerium-installed/Cerium.exe" --lang=fr
        elif [ "$RUNNER_OS" = macOS ]; then
          mount="$RUNNER_TEMP/cerium-dmg"
          hdiutil attach "$out"/Cerium-"$VERSION"-*.dmg -nobrowse -readonly -mountpoint "$mount" > /dev/null
          codesign --verify --deep --strict "$mount/Cerium.app"
          smoke dmg "$mount/Cerium.app/Contents/MacOS/Cerium" --lang=fr
          echo "Detaching the smoke test disk image."
          node --input-type=module -e '
            import { execFileSync } from "node:child_process";
            const detach = (flags) =>
              execFileSync("hdiutil", ["detach", ...flags, process.argv[1]], {
                timeout: 30_000,
                killSignal: "SIGKILL",
                stdio: "inherit",
              });
            try {
              detach([]);
            } catch {
              detach(["-force"]);
            }
          ' "$mount"
        else
          export LANGUAGE=fr
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          images=("$GITHUB_WORKSPACE/$out/Cerium-$VERSION-"*.AppImage)
          (cd "$RUNNER_TEMP" && "${images[0]}" --appimage-extract > /dev/null)
          smoke appimage xvfb-run -a "$RUNNER_TEMP/squashfs-root/AppRun"
        fi
        if [ -n "$RELEASE" ]; then
          wait "$upload" || { cat "$RUNNER_TEMP/upload.log"; echo "::error::The upload to $RELEASE failed."; exit 1; }
          echo "Uploaded ${#packages[@]} files to the draft release $RELEASE."
        fi
      env:
        VERSION: ${{ inputs.version }}
        RELEASE: ${{ inputs.release }}
        UPLOAD_TOKEN: ${{ inputs.github-token }}
        COMPRESSION: ${{ inputs.compression }}

    - name: Keep the smoke test's logs
      if: failure()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: smoke-test-${{ runner.os }}-${{ runner.arch }}
        path: |
          ${{ runner.temp }}/smoke-test/*/smoke-test.log
          ${{ runner.temp }}/smoke-test/*/logs
        if-no-files-found: ignore
        retention-days: 7

    # The installers are already compressed.
    - if: inputs.upload-artifact == 'true' && env.CERIUM_STABLE_CANDIDATE != 'true' && inputs.release == ''
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: package-${{ runner.os }}-${{ runner.arch }}
        compression-level: 0
        path: |
          apps/desktop/out/*.exe
          apps/desktop/out/*.exe.blockmap
          apps/desktop/out/*.AppImage
          apps/desktop/out/*.dmg
          apps/desktop/out/*-mac.zip
          apps/desktop/out/*-mac.zip.blockmap
          apps/desktop/out/cerium-dictation-*.wasm
          apps/desktop/out/latest*.yml
          apps/desktop/out/nightly*.yml
        if-no-files-found: error
        retention-days: 3

    # Nightly publication collects the update feed from each platform.
    - if: env.CERIUM_STABLE_CANDIDATE != 'true' && inputs.release != ''
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: update-files-${{ runner.os }}-${{ runner.arch }}
        path: |
          apps/desktop/out/latest*.yml
          apps/desktop/out/nightly*.yml
        if-no-files-found: error
        retention-days: 3
