name: Package the app
description: >-
  Builds the desktop shell and the UI it loads, and packages them for the runner's platform and
  processor, or the one `arch` names, into apps/desktop/out: on Windows the unsigned installer, its
  blockmap and its update file; on Linux the AppImage, the .deb, the .rpm and their update file; on
  macOS the disk image, the zip updates install from and their update file, signed with a Developer
  ID and notarized when the certificate and API key are given, else signed ad hoc. Then starts what
  was packaged with --smoke-test (apps/desktop/src/smokeTest.ts), on Linux once installed from the
  .deb as well, and uploads the packages as the `package-<OS>-<arch>` artifact, or to the draft
  release `release` names, with their update file as the `update-files-<OS>-<arch>` artifact.
  Windows x64 also uploads the version's shared dictation runtime.

inputs:
  version:
    description: The version the package carries, from scripts/release.ts.
    required: true
  compression:
    description: >-
      `maximum` uses release compression, for stable releases. `balanced` differs only in the Linux
      packages, for published nightlies: the .rpm takes xz's own level, 6 instead of 9, and it and
      the .deb are compressed on every core, which packs them in well under half the time for an .rpm
      about 3% larger and a .deb under 1% larger. `fast` uses a lower LZMA2 level and packs the .deb
      and .rpm with gzip (apps/desktop/electron-builder.ts), so runs that only check the packaging
      finish sooner.
    required: true
  arch:
    description: >-
      The processor to package for, `x64` or `arm64`, when it isn't the runner's: the Intel Mac app
      is packaged on Apple silicon, several times faster than on an Intel runner, from an install
      with both processors' native packages (.github/actions/setup's `cpu`), and started through
      Rosetta. Empty packages for the runner's own.
    required: false
    default: ""
  chromium-locales:
    description: >-
      Ship all Chromium locale packs, or only English for a smaller installer; `both` packages one of
      each, on macOS only.
    required: false
    default: full
  release:
    description: >-
      The tag of the draft release a push's nightly is gathered in (.github/workflows/ci.yml), to
      upload the packages to while the smoke test runs, so publishing only adds the update files the
      runners share and makes the release public. Empty uploads them as an artifact instead.
    required: false
    default: ""
  github-token:
    description: A token that may upload to the draft release; only the upload sees it.
    required: false
    default: ""
  sentry-dsn:
    description: >-
      Where the packaged app sends its anonymous crash reports (apps/desktop/src/crashReports.ts),
      the repository's SENTRY_DSN variable; without one the app sends none.
    required: false
    default: ""
  mac-certificate:
    description: The Developer ID Application certificate and its key, a base64 .p12 (macOS only).
    required: false
    default: ""
  mac-certificate-password:
    description: The .p12's password.
    required: false
    default: ""
  apple-api-key:
    description: An App Store Connect API key (.p8 contents) that notarizes the signed app.
    required: false
    default: ""
  apple-api-key-id:
    description: The API key's ID.
    required: false
    default: ""
  apple-api-issuer:
    description: The API key's issuer ID.
    required: false
    default: ""

runs:
  using: composite
  steps:
    # The Fedora container the .rpm's smoke test runs in (below) is pulled, and fetches its package
    # lists and the virtual display, while the app builds and packs, which leaves only the .rpm and
    # the dependencies it names for the smoke test to install. The packages folder is mounted from
    # its parent, which exists already. Its outcome lands in fedora-ready for the smoke test to read.
    # Ubuntu's own package lists, which installing the .deb reads, are refreshed meanwhile too.
    - name: Start the Fedora container and refresh Ubuntu's package lists
      if: runner.os == 'Linux'
      shell: bash
      run: |
        mkdir -p "$RUNNER_TEMP/smoke-test/rpm" && chmod 777 "$RUNNER_TEMP/smoke-test/rpm"
        (
          docker run -d --name fedora --shm-size=1g --security-opt seccomp=unconfined \
            --security-opt apparmor=unconfined -v "$GITHUB_WORKSPACE/apps/desktop:/desktop:ro" \
            -v "$RUNNER_TEMP/smoke-test/rpm:/smoke-test" "$FEDORA" sleep infinity &&
            docker exec fedora dnf install -y -q xorg-x11-server-Xvfb xorg-x11-xauth
          echo $? > "$RUNNER_TEMP/fedora-ready"
        ) > "$RUNNER_TEMP/fedora.log" 2>&1 &
        (
          status=0
          sudo apt-get update -q || status=$?
          echo "$status" > "$RUNNER_TEMP/apt-ready"
        ) > "$RUNNER_TEMP/apt.log" 2>&1 &
      env:
        # The newest Fedora release, the one most of its users run.
        FEDORA: fedora:latest

    - id: react-compiler-cache
      uses: ./.github/actions/react-compiler-cache
      with:
        mode: desktop

    - name: Build
      shell: bash
      run: |
        bun run build:desktop
        if compgen -G 'apps/ui/dist/assets/ort-wasm-*.wasm' > /dev/null; then
          echo "::error::ONNX WebAssembly was bundled into the desktop UI."
          exit 1
        fi
      env:
        CERIUM_VERSION: ${{ inputs.version }}
        CERIUM_SENTRY_DSN: ${{ inputs.sentry-dsn }}
        CERIUM_OPTIONAL_DICTATION: "1"
        CERIUM_REACT_COMPILER_CACHE: ${{ steps.react-compiler-cache.outputs.file }}

    - name: Save the React compiler cache
      if: steps.react-compiler-cache.outputs.save-key != ''
      continue-on-error: true
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.react-compiler-cache.outputs.file }}
        key: ${{ steps.react-compiler-cache.outputs.save-key }}

    # electron-builder downloads Electron, NSIS, the AppImage tools, fpm and the rest into these folders.
    # A pull request restores them but saves nothing: its cache entry would only evict main's.
    - id: electron-builder-cache
      if: env.CERIUM_STABLE_CANDIDATE != 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/AppData/Local/electron/Cache
          ~/AppData/Local/electron-builder/Cache
          ~/.cache/electron
          ~/.cache/electron-builder
          ~/Library/Caches/electron
          ~/Library/Caches/electron-builder
        key: electron-builder-${{ runner.os }}-${{ inputs.arch || runner.arch }}-${{ hashFiles('apps/desktop/package.json') }}

    # Both architectures install the .deb during the smoke test. The image's package lists can
    # refer to superseded Ubuntu packages even when rpmbuild is already installed. They were refreshed
    # while the app built (above). Surface that operation's result before using either package.
    - name: Wait for Ubuntu's package lists and ensure rpmbuild is installed
      if: runner.os == 'Linux'
      shell: bash
      run: |
        for _ in $(seq 120); do [ -s "$RUNNER_TEMP/apt-ready" ] && break; sleep 1; done
        cat "$RUNNER_TEMP/apt.log"
        status=$(cat "$RUNNER_TEMP/apt-ready")
        if [ "$status" != 0 ]; then exit "$status"; fi
        command -v rpmbuild > /dev/null || sudo apt-get install -y -q --no-install-recommends rpm

    # The patched Windows packager builds its uninstaller in a separate executable, so makensis
    # can write the final installer while the first executable is still locked. On macOS it signs with
    # the certificate in CSC_LINK and notarizes with the key file APPLE_API_KEY names; without them
    # it signs ad hoc (apps/desktop/electron-builder.ts). A pull request's build (GITHUB_BASE_REF set)
    # always signs ad hoc, which takes no secret. electron-builder signs nothing for one unless
    # CSC_FOR_PULL_REQUEST says to, which left Electron's own signature on a bundle it no longer
    # matched and the smoke test's codesign check refused it. On Linux the AppImage, the .deb and the
    # .rpm pack side by side, where one after another took two minutes, each in a folder of its own
    # since each marks its unpacked app with its own package type. Their update files are then joined
    # into the one a single run writes, the AppImage's first (scripts/merge-update-files.ts). A
    # nightly's .rpm, at xz level 9 on the two cores its two blocks could use, took nearly three
    # minutes and was the last thing a Linux job waited for: `balanced` has electron-builder.ts pack
    # it at level 6, on every core. The .deb's xz, which GNU tar starts with the level fpm names in
    # XZ_OPT, reads XZ_DEFAULTS before it and so uses every core as well.
    - name: Package
      shell: bash
      run: |
        case "$COMPRESSION" in
          fast) export ELECTRON_BUILDER_COMPRESSION_LEVEL=1 ;;
          balanced) export XZ_DEFAULTS=-T0 CERIUM_RPM_COMPRESSION_LEVEL=6 ;;
          maximum) ;;
          *)
            echo "::error::compression is '$COMPRESSION', not fast, balanced or maximum."
            exit 1
            ;;
        esac
        if [ "$RUNNER_OS" = macOS ] && { [ -n "${GITHUB_BASE_REF:-}" ] || [ "$GITHUB_EVENT_NAME" = merge_group ]; }; then
          export CSC_FOR_PULL_REQUEST=true
        elif [ "$RUNNER_OS" = macOS ] && [ -n "$MAC_CERTIFICATE" ]; then
          export CSC_LINK="$MAC_CERTIFICATE" CSC_KEY_PASSWORD="$MAC_CERTIFICATE_PASSWORD"
          if [ -n "$APPLE_API_KEY_CONTENTS" ]; then
            printf '%s' "$APPLE_API_KEY_CONTENTS" > "$RUNNER_TEMP/apple-api-key.p8"
            export APPLE_API_KEY="$RUNNER_TEMP/apple-api-key.p8"
          fi
        fi
        # electron-builder refuses half a notarization key.
        if [ -z "${APPLE_API_KEY:-}" ]; then unset APPLE_API_KEY_ID APPLE_API_ISSUER; fi
        package() { bun run --cwd apps/desktop package ${ARCH:+"--$ARCH"} "$@"; }
        if [ "$CERIUM_CHROMIUM_LOCALES" = both ] && [ "$RUNNER_OS" != macOS ]; then
          echo "::error::chromium-locales 'both' only packages on macOS."
          exit 1
        fi
        if [ "$RUNNER_OS" != Linux ]; then
          if [ "$CERIUM_CHROMIUM_LOCALES" = both ]; then
            # electron-builder.ts reads anything but english as the full set, so each pass names its own.
            for locales in full english; do
              CERIUM_CHROMIUM_LOCALES="$locales" package -c.directories.output="out/$locales"
              mkdir -p "$RUNNER_TEMP/locales/$locales"
              find "apps/desktop/out/$locales" -maxdepth 1 -type f ! -name 'builder-*' -exec mv {} "$RUNNER_TEMP/locales/$locales/" \;
            done
            node scripts/merge-update-files.ts "$RUNNER_TEMP/locales" apps/desktop/out
            exit 0
          fi
          package
          exit 0
        fi
        targets=(AppImage deb rpm)
        pids=()
        for target in "${targets[@]}"; do
          package --linux "$target" -c.directories.output="out/$target" > "$RUNNER_TEMP/package-$target.log" 2>&1 &
          pids+=("$!")
        done
        failed=0
        for i in "${!targets[@]}"; do
          if wait "${pids[$i]}"; then
            echo "::group::${targets[$i]}" && cat "$RUNNER_TEMP/package-${targets[$i]}.log" && echo "::endgroup::"
          else
            failed=1
            cat "$RUNNER_TEMP/package-${targets[$i]}.log"
            echo "::error::Packing the ${targets[$i]} failed."
          fi
        done
        [ "$failed" = 0 ]
        for target in "${targets[@]}"; do
          mkdir -p "$RUNNER_TEMP/linux/$target"
          find "apps/desktop/out/$target" -maxdepth 1 -type f ! -name 'builder-*' -exec mv -t "$RUNNER_TEMP/linux/$target" {} +
        done
        node scripts/merge-update-files.ts "$RUNNER_TEMP/linux" apps/desktop/out
      env:
        CERIUM_VERSION: ${{ inputs.version }}
        CERIUM_CHROMIUM_LOCALES: ${{ inputs.chromium-locales }}
        COMPRESSION: ${{ inputs.compression }}
        ARCH: ${{ inputs.arch }}
        MAC_CERTIFICATE: ${{ inputs.mac-certificate }}
        MAC_CERTIFICATE_PASSWORD: ${{ inputs.mac-certificate-password }}
        APPLE_API_KEY_CONTENTS: ${{ inputs.apple-api-key }}
        APPLE_API_KEY_ID: ${{ inputs.apple-api-key-id }}
        APPLE_API_ISSUER: ${{ inputs.apple-api-issuer }}

    - name: Save the electron-builder cache
      if: env.CERIUM_STABLE_CANDIDATE != 'true' && github.event_name != 'pull_request' && steps.electron-builder-cache.outputs.cache-hit != 'true'
      continue-on-error: true
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/AppData/Local/electron/Cache
          ~/AppData/Local/electron-builder/Cache
          ~/.cache/electron
          ~/.cache/electron-builder
          ~/Library/Caches/electron
          ~/Library/Caches/electron-builder
        key: electron-builder-${{ runner.os }}-${{ inputs.arch || runner.arch }}-${{ hashFiles('apps/desktop/package.json') }}

    # Starts the packaged app as a user would and waits for its backend and UI. On Linux the .deb is
    # installed first and started as the system's package manager left it: its AppArmor profile is what
    # lets Chromium's sandbox into the unprivileged user namespaces Ubuntu's AppArmor otherwise keeps
    # from it. Then the AppImage, unpacked since the runner has no FUSE to mount it with, which only
    # sandboxes itself once those namespaces are let through. Meanwhile the .rpm is installed with dnf
    # in the Fedora container started above, which checks its dependencies resolve there, and,
    # alongside the AppImage, started by a user of its own,
    # since Chromium won't sandbox itself as root; the container's own seccomp and AppArmor profiles
    # would keep the sandbox out of the namespaces a Fedora desktop lets it into, and leave it apart
    # from the runner's. The Fedora container shares the runner's kernel: the .rpm installs while the
    # .deb is tested, half a minute that used to follow it, but starts only after
    # the .deb has tested Ubuntu's AppArmor profile and the user-namespace restriction is lifted,
    # otherwise its unprivileged Chromium can start before that sysctl and abort. All run on a virtual
    # display. On macOS the app starts from its disk image,
    # once its signature checks out. On Windows the installer takes the job's temporary folder for
    # its own: it unpacks the whole app there before copying it into place, and the one Windows gives
    # it is on the system drive, slower than the checkout's on x64 runners and scanned by Defender on
    # Arm64's. A report is printed again when a start fails, in case the Windows
    # app's own output went nowhere. A push's packages upload to its draft release meanwhile, with the
    # token given to the upload alone, never to the app.
    - name: Smoke test
      shell: bash
      run: |
        out=apps/desktop/out
        prefix=Cerium
        export CERIUM_SMOKE_LOCALE=fr
        if [ "$CHROMIUM_LOCALES" = english ]; then
          prefix=Cerium-english
          CERIUM_SMOKE_LOCALE=en-US
        fi
        # The WebAssembly is identical across platforms. Publish it from one runner, which also
        # runs when a pull request only packages for Windows x64.
        runtime=()
        if [ "$RUNNER_OS" = Windows ] && [ "$RUNNER_ARCH" = X64 ] && [ "$CHROMIUM_LOCALES" = full ]; then
          asset="cerium-dictation-$VERSION.wasm"
          cp "apps/ui/dist/$asset" "$out/$asset"
          runtime=("$out/$asset")
        fi
        if [ -n "$RELEASE" ]; then
          shopt -s nullglob
          packages=("$out"/*.{exe,exe.blockmap,AppImage,deb,rpm,dmg} "$out"/*-mac.zip{,.blockmap} "${runtime[@]}")
          GH_TOKEN="$UPLOAD_TOKEN" gh release upload "$RELEASE" "${packages[@]}" --clobber \
            > "$RUNNER_TEMP/upload.log" 2>&1 &
          upload=$!
          shopt -u nullglob
        fi
        unset UPLOAD_TOKEN
        smoke() {
          local report="$RUNNER_TEMP/smoke-test/$1"
          shift
          "$@" --smoke-test="$report" || {
            local status=$?
            cat "$report/smoke-test.log" 2>/dev/null || echo "The app wrote no report."
            exit "$status"
          }
        }
        if [ "$RUNNER_OS" = Windows ]; then
          installers=("$out"/*.exe)
          export CERIUM_SMOKE_INSTALLER
          CERIUM_SMOKE_INSTALLER="$(cygpath -aw "${installers[0]}")"
          powershell.exe -NoProfile -NonInteractive -Command '
            $ErrorActionPreference = "Stop"
            $directory = Join-Path $env:RUNNER_TEMP "cerium-installed"
            $temporary = Join-Path $env:RUNNER_TEMP "cerium-installer"
            New-Item -ItemType Directory -Force $temporary | Out-Null
            $env:TEMP = $env:TMP = $temporary
            $installer = Start-Process -FilePath $env:CERIUM_SMOKE_INSTALLER -Wait -PassThru `
              -ArgumentList "/S", "/currentuser", "/D=$directory"
            exit $installer.ExitCode
          '
          smoke installer "$(cygpath -u "$RUNNER_TEMP")/cerium-installed/Cerium.exe" --lang=fr
        elif [ "$RUNNER_OS" = macOS ]; then
          # An Intel app packaged on Apple silicon starts through Rosetta, installed when the runner
          # lacks it.
          if [ "$ARCH" = x64 ] && ! arch -x86_64 /usr/bin/true 2> /dev/null; then
            sudo softwareupdate --install-rosetta --agree-to-license
          fi
          # The app as the disk image holds it, mounted read-only as a user's Mac would.
          dmg() {
            local prefix=$1 report=$3
            export CERIUM_SMOKE_LOCALE=$2
            mount="$RUNNER_TEMP/cerium-dmg-$report"
            hdiutil attach "$out"/"$prefix"-"$VERSION"-*.dmg -nobrowse -readonly -mountpoint "$mount" > /dev/null
            codesign --verify --deep --strict "$mount/Cerium.app"
            smoke "$report" "$mount/Cerium.app/Contents/MacOS/Cerium" --lang=fr
            echo "Detaching the smoke test disk image."
            node --input-type=module -e '
              import { execFileSync } from "node:child_process";
              const detach = (flags) =>
                execFileSync("hdiutil", ["detach", ...flags, process.argv[1]], {
                  timeout: 30_000,
                  killSignal: "SIGKILL",
                  stdio: "inherit",
                });
              try {
                detach([]);
              } catch {
                detach(["-force"]);
              }
            ' "$mount"
          }
          if [ "$CHROMIUM_LOCALES" = both ]; then
            dmg Cerium fr dmg
            dmg Cerium-english en-US dmg-english
          else
            dmg "$prefix" "$CERIUM_SMOKE_LOCALE" dmg
          fi
        else
          export LANGUAGE=fr
          lifted="$RUNNER_TEMP/userns-lifted"
          (
            for _ in $(seq 300); do [ -s "$RUNNER_TEMP/fedora-ready" ] && break; sleep 1; done
            if [ "$(cat "$RUNNER_TEMP/fedora-ready" 2>/dev/null)" != 0 ]; then
              cat "$RUNNER_TEMP/fedora.log"
              echo "::error::The Fedora container didn't start."
              exit 1
            fi
            docker exec fedora bash -euo pipefail -c '
                dnf install -y -q /desktop/out/cerium-*.rpm
                useradd -m user'
            for _ in $(seq 600); do [ -e "$lifted" ] && break; sleep 1; done
            if [ ! -e "$lifted" ]; then
              echo "::error::The .deb's smoke test never finished, so the .rpm's didn't start."
              exit 1
            fi
            docker exec -e CERIUM_SMOKE_LOCALE fedora \
              su user -c "LANGUAGE=fr xvfb-run -a cerium --smoke-test=/smoke-test" || {
              status=$?
              cat "$RUNNER_TEMP/smoke-test/rpm/smoke-test.log" 2>/dev/null || echo "The app wrote no report."
              exit "$status"
            }
          ) > "$RUNNER_TEMP/rpm-smoke-test.log" 2>&1 &
          rpm=$!
          sudo apt-get install -y "$GITHUB_WORKSPACE/$out"/cerium*.deb
          smoke deb xvfb-run -a cerium
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          touch "$lifted"
          (cd "$RUNNER_TEMP" && "$GITHUB_WORKSPACE/$out"/"$prefix"-"$VERSION"-*.AppImage --appimage-extract > /dev/null)
          smoke appimage xvfb-run -a "$RUNNER_TEMP/squashfs-root/AppRun"
          if wait "$rpm"; then
            echo "::group::The .rpm in Fedora" && cat "$RUNNER_TEMP/rpm-smoke-test.log" && echo "::endgroup::"
          else
            status=$?
            cat "$RUNNER_TEMP/rpm-smoke-test.log"
            exit "$status"
          fi
        fi
        if [ -n "$RELEASE" ]; then
          wait "$upload" || { cat "$RUNNER_TEMP/upload.log"; echo "::error::The upload to $RELEASE failed."; exit 1; }
          echo "Uploaded ${#packages[@]} files to the draft release $RELEASE."
        fi
      env:
        VERSION: ${{ inputs.version }}
        ARCH: ${{ inputs.arch }}
        CHROMIUM_LOCALES: ${{ inputs.chromium-locales }}
        RELEASE: ${{ inputs.release }}
        UPLOAD_TOKEN: ${{ inputs.github-token }}

    - name: Keep the smoke test's logs
      if: failure() && env.CERIUM_STABLE_CANDIDATE != 'true'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: smoke-test-${{ runner.os }}-${{ inputs.arch || runner.arch }}-${{ inputs.chromium-locales }}
        path: |
          ${{ runner.temp }}/smoke-test/*/smoke-test.log
          ${{ runner.temp }}/smoke-test/*/logs
        if-no-files-found: ignore
        retention-days: 7

    # Stored as they are: the packages are compressed already, and zipping them again slowed the Intel
    # Mac's upload to a third of Linux's.
    - if: env.CERIUM_STABLE_CANDIDATE != 'true' && inputs.release == ''
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: package-${{ runner.os }}-${{ inputs.arch || runner.arch }}-${{ inputs.chromium-locales }}
        compression-level: 0
        path: |
          apps/desktop/out/*.exe
          apps/desktop/out/*.exe.blockmap
          apps/desktop/out/*.AppImage
          apps/desktop/out/*.deb
          apps/desktop/out/*.rpm
          apps/desktop/out/*.dmg
          apps/desktop/out/*-mac.zip
          apps/desktop/out/*-mac.zip.blockmap
          apps/desktop/out/cerium-dictation-*.wasm
          apps/desktop/out/latest*.yml
          apps/desktop/out/nightly*.yml
        if-no-files-found: error
        retention-days: 3

    # The update file publishing merges with the other processor's, the one file a draft release's
    # runners share.
    - if: env.CERIUM_STABLE_CANDIDATE != 'true' && inputs.release != ''
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: update-files-${{ runner.os }}-${{ inputs.arch || runner.arch }}-${{ inputs.chromium-locales }}
        path: |
          apps/desktop/out/latest*.yml
          apps/desktop/out/nightly*.yml
        if-no-files-found: error
        retention-days: 3
