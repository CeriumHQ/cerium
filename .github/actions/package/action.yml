name: Package the app
description: >-
  Builds the desktop shell and the UI it loads, and packages them for the runner's platform and
  processor, or the one `arch` names, into apps/desktop/out: on Windows the unsigned installer, its
  blockmap and its update file; on Linux the AppImage, the .deb, the .rpm and their update file; on
  macOS the disk image, the zip updates install from and their update file, signed with a Developer
  ID and notarized when the certificate and API key are given, else signed ad hoc. Then starts what
  was packaged with --smoke-test (apps/desktop/src/smokeTest.ts), on Linux once installed from the
  .deb as well, and uploads the packages as the `package-<OS>-<arch>` artifact, or to the draft
  release `release` names, with their update file as the `update-files-<OS>-<arch>` artifact.

inputs:
  version:
    description: The version the package carries, from scripts/release.ts.
    required: true
  compression:
    description: >-
      `maximum` packs the installer smallest, for a stable release. `fast` packs it in about half the
      time and a tenth larger, still with LZMA2, and the .deb and .rpm with gzip instead of xz
      (apps/desktop/electron-builder.ts), so each installs and updates the same way: for nightlies and
      for runs that only check the packaging.
    required: true
  arch:
    description: >-
      The processor to package for, `x64` or `arm64`, when it isn't the runner's: the Intel Mac app
      is packaged on Apple silicon, several times faster than on an Intel runner, from an install
      with both processors' native packages (.github/actions/setup's `cpu`), and started through
      Rosetta. Empty packages for the runner's own.
    required: false
    default: ""
  release:
    description: >-
      The tag of the draft release a push's nightly is gathered in (.github/workflows/ci.yml), to
      upload the packages to while the smoke test runs, so publishing only adds the update files the
      runners share and makes the release public. Empty uploads them as an artifact instead.
    required: false
    default: ""
  github-token:
    description: A token that may upload to the draft release; only the upload sees it.
    required: false
    default: ""
  sentry-dsn:
    description: >-
      Where the packaged app sends its anonymous crash reports (apps/desktop/src/crashReports.ts),
      the repository's SENTRY_DSN variable; without one the app sends none.
    required: false
    default: ""
  mac-certificate:
    description: The Developer ID Application certificate and its key, a base64 .p12 (macOS only).
    required: false
    default: ""
  mac-certificate-password:
    description: The .p12's password.
    required: false
    default: ""
  apple-api-key:
    description: An App Store Connect API key (.p8 contents) that notarizes the signed app.
    required: false
    default: ""
  apple-api-key-id:
    description: The API key's ID.
    required: false
    default: ""
  apple-api-issuer:
    description: The API key's issuer ID.
    required: false
    default: ""

runs:
  using: composite
  steps:
    # The Fedora container the .rpm's smoke test runs in (below) is pulled, and fetches its package
    # lists and the virtual display, while the app builds and packs, which leaves only the .rpm and
    # the dependencies it names for the smoke test to install. The packages folder is mounted from
    # its parent, which exists already. Its outcome lands in fedora-ready for the smoke test to read.
    - name: Start the Fedora container
      if: runner.os == 'Linux'
      shell: bash
      run: |
        mkdir -p "$RUNNER_TEMP/smoke-test/rpm" && chmod 777 "$RUNNER_TEMP/smoke-test/rpm"
        (
          docker run -d --name fedora --shm-size=1g --security-opt seccomp=unconfined \
            --security-opt apparmor=unconfined -v "$GITHUB_WORKSPACE/apps/desktop:/desktop:ro" \
            -v "$RUNNER_TEMP/smoke-test/rpm:/smoke-test" "$FEDORA" sleep infinity &&
            docker exec fedora dnf install -y -q xorg-x11-server-Xvfb xorg-x11-xauth
          echo $? > "$RUNNER_TEMP/fedora-ready"
        ) > "$RUNNER_TEMP/fedora.log" 2>&1 &
      env:
        # The newest Fedora release, the one most of its users run.
        FEDORA: fedora:latest

    - name: Build
      shell: bash
      run: bun run build:desktop
      env:
        CERIUM_VERSION: ${{ inputs.version }}
        CERIUM_SENTRY_DSN: ${{ inputs.sentry-dsn }}

    # electron-builder downloads Electron, NSIS, the AppImage tools, fpm and the rest into these folders.
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/AppData/Local/electron/Cache
          ~/AppData/Local/electron-builder/Cache
          ~/.cache/electron
          ~/.cache/electron-builder
          ~/Library/Caches/electron
          ~/Library/Caches/electron-builder
        key: electron-builder-${{ runner.os }}-${{ inputs.arch || runner.arch }}-${{ hashFiles('apps/desktop/package.json') }}

    # fpm, which electron-builder brings, builds the .rpm with the system's rpmbuild, which the x64
    # image already has.
    - name: Install rpmbuild
      if: runner.os == 'Linux'
      shell: bash
      run: |
        command -v rpmbuild > /dev/null ||
          { sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends rpm; }

    # makensis now and then fails with "Can't open output file" while writing the installer; seen in
    # fresh checkouts, and a second attempt has always succeeded. On macOS, electron-builder signs with
    # the certificate in CSC_LINK and notarizes with the key file APPLE_API_KEY names; without them
    # it signs ad hoc (apps/desktop/electron-builder.ts). A pull request's build (GITHUB_BASE_REF set)
    # always signs ad hoc, which takes no secret. electron-builder signs nothing for one unless
    # CSC_FOR_PULL_REQUEST says to, which left Electron's own signature on a bundle it no longer
    # matched and the smoke test's codesign check refused it. On Linux the AppImage, the .deb and the
    # .rpm pack side by side, where one after another took two minutes, each in a folder of its own
    # since each marks its unpacked app with its own package type. Their update files are then joined
    # into the one a single run writes, the AppImage's first (scripts/merge-update-files.ts).
    - name: Package
      shell: bash
      run: |
        if [ "$COMPRESSION" = fast ]; then export ELECTRON_BUILDER_COMPRESSION_LEVEL=1; fi
        if [ "$RUNNER_OS" = macOS ] && [ -n "${GITHUB_BASE_REF:-}" ]; then
          export CSC_FOR_PULL_REQUEST=true
        elif [ "$RUNNER_OS" = macOS ] && [ -n "$MAC_CERTIFICATE" ]; then
          export CSC_LINK="$MAC_CERTIFICATE" CSC_KEY_PASSWORD="$MAC_CERTIFICATE_PASSWORD"
          if [ -n "$APPLE_API_KEY_CONTENTS" ]; then
            printf '%s' "$APPLE_API_KEY_CONTENTS" > "$RUNNER_TEMP/apple-api-key.p8"
            export APPLE_API_KEY="$RUNNER_TEMP/apple-api-key.p8"
          fi
        fi
        # electron-builder refuses half a notarization key.
        if [ -z "${APPLE_API_KEY:-}" ]; then unset APPLE_API_KEY_ID APPLE_API_ISSUER; fi
        package() { bun run --cwd apps/desktop package ${ARCH:+"--$ARCH"} "$@"; }
        if [ "$RUNNER_OS" != Linux ]; then
          package || { sleep 10 && package; }
          exit 0
        fi
        targets=(AppImage deb rpm)
        pids=()
        for target in "${targets[@]}"; do
          package --linux "$target" -c.directories.output="out/$target" > "$RUNNER_TEMP/package-$target.log" 2>&1 &
          pids+=("$!")
        done
        failed=0
        for i in "${!targets[@]}"; do
          if wait "${pids[$i]}"; then
            echo "::group::${targets[$i]}" && cat "$RUNNER_TEMP/package-${targets[$i]}.log" && echo "::endgroup::"
          else
            failed=1
            cat "$RUNNER_TEMP/package-${targets[$i]}.log"
            echo "::error::Packing the ${targets[$i]} failed."
          fi
        done
        [ "$failed" = 0 ]
        for target in "${targets[@]}"; do
          mkdir -p "$RUNNER_TEMP/linux/$target"
          find "apps/desktop/out/$target" -maxdepth 1 -type f ! -name 'builder-*' -exec mv -t "$RUNNER_TEMP/linux/$target" {} +
        done
        node scripts/merge-update-files.ts "$RUNNER_TEMP/linux" apps/desktop/out
      env:
        CERIUM_VERSION: ${{ inputs.version }}
        COMPRESSION: ${{ inputs.compression }}
        ARCH: ${{ inputs.arch }}
        MAC_CERTIFICATE: ${{ inputs.mac-certificate }}
        MAC_CERTIFICATE_PASSWORD: ${{ inputs.mac-certificate-password }}
        APPLE_API_KEY_CONTENTS: ${{ inputs.apple-api-key }}
        APPLE_API_KEY_ID: ${{ inputs.apple-api-key-id }}
        APPLE_API_ISSUER: ${{ inputs.apple-api-issuer }}

    # Starts the packaged app as a user would and waits for its backend and UI. On Linux the .deb is
    # installed first and started as the system's package manager left it: its AppArmor profile is what
    # lets Chromium's sandbox into the unprivileged user namespaces Ubuntu's AppArmor otherwise keeps
    # from it. Then the AppImage, unpacked since the runner has no FUSE to mount it with, which only
    # sandboxes itself once those namespaces are let through. Alongside the AppImage, the .rpm is installed with dnf in
    # the Fedora container started above, which checks its dependencies resolve there, and started by
    # a user of its own,
    # since Chromium won't sandbox itself as root; the container's own seccomp and AppArmor profiles
    # would keep the sandbox out of the namespaces a Fedora desktop lets it into, and leave it apart
    # from the runner's. The Fedora container shares the runner's kernel: start its test only after
    # the .deb has tested Ubuntu's AppArmor profile and the user-namespace restriction is lifted,
    # otherwise its unprivileged Chromium can start before that sysctl and abort. All run on a virtual
    # display. On macOS the app starts from its disk image,
    # once its signature checks out. A report is printed again when a start fails, in case the Windows
    # app's own output went nowhere. A push's packages upload to its draft release meanwhile, with the
    # token given to the upload alone, never to the app.
    - name: Smoke test
      shell: bash
      run: |
        out=apps/desktop/out
        if [ -n "$RELEASE" ]; then
          shopt -s nullglob
          packages=("$out"/*.{exe,exe.blockmap,AppImage,deb,rpm,dmg} "$out"/*-mac.zip{,.blockmap})
          GH_TOKEN="$UPLOAD_TOKEN" gh release upload "$RELEASE" "${packages[@]}" --clobber \
            > "$RUNNER_TEMP/upload.log" 2>&1 &
          upload=$!
          shopt -u nullglob
        fi
        unset UPLOAD_TOKEN
        smoke() {
          local report="$RUNNER_TEMP/smoke-test/$1"
          shift
          "$@" --smoke-test="$report" || {
            local status=$?
            cat "$report/smoke-test.log" 2>/dev/null || echo "The app wrote no report."
            exit "$status"
          }
        }
        if [ "$RUNNER_OS" = Windows ]; then
          if [ "$RUNNER_ARCH" = ARM64 ]; then unpacked=win-arm64-unpacked; else unpacked=win-unpacked; fi
          smoke installer "$out/$unpacked/Cerium.exe"
        elif [ "$RUNNER_OS" = macOS ]; then
          # An Intel app packaged on Apple silicon starts through Rosetta, installed when the runner
          # lacks it.
          if [ "$ARCH" = x64 ] && ! arch -x86_64 /usr/bin/true 2> /dev/null; then
            sudo softwareupdate --install-rosetta --agree-to-license
          fi
          # The app as the disk image holds it, mounted read-only as a user's Mac would.
          mount="$RUNNER_TEMP/cerium-dmg"
          hdiutil attach "$out"/Cerium-"$VERSION"-*.dmg -nobrowse -readonly -mountpoint "$mount" > /dev/null
          codesign --verify --deep --strict "$mount/Cerium.app"
          smoke dmg "$mount/Cerium.app/Contents/MacOS/Cerium"
          hdiutil detach "$mount" > /dev/null
        else
          sudo apt-get install -y "$GITHUB_WORKSPACE/$out"/cerium_*.deb
          smoke deb xvfb-run -a cerium
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          (
            for _ in $(seq 300); do [ -s "$RUNNER_TEMP/fedora-ready" ] && break; sleep 1; done
            if [ "$(cat "$RUNNER_TEMP/fedora-ready" 2>/dev/null)" != 0 ]; then
              cat "$RUNNER_TEMP/fedora.log"
              echo "::error::The Fedora container didn't start."
              exit 1
            fi
            docker exec fedora bash -euo pipefail -c '
                dnf install -y -q /desktop/out/cerium-*.rpm
                useradd -m user
                su user -c "xvfb-run -a cerium --smoke-test=/smoke-test"' || {
              status=$?
              cat "$RUNNER_TEMP/smoke-test/rpm/smoke-test.log" 2>/dev/null || echo "The app wrote no report."
              exit "$status"
            }
          ) > "$RUNNER_TEMP/rpm-smoke-test.log" 2>&1 &
          rpm=$!
          (cd "$RUNNER_TEMP" && "$GITHUB_WORKSPACE/$out"/Cerium-"$VERSION"-*.AppImage --appimage-extract > /dev/null)
          smoke appimage xvfb-run -a "$RUNNER_TEMP/squashfs-root/AppRun"
          if wait "$rpm"; then
            echo "::group::The .rpm in Fedora" && cat "$RUNNER_TEMP/rpm-smoke-test.log" && echo "::endgroup::"
          else
            status=$?
            cat "$RUNNER_TEMP/rpm-smoke-test.log"
            exit "$status"
          fi
        fi
        if [ -n "$RELEASE" ]; then
          wait "$upload" || { cat "$RUNNER_TEMP/upload.log"; echo "::error::The upload to $RELEASE failed."; exit 1; }
          echo "Uploaded ${#packages[@]} files to the draft release $RELEASE."
        fi
      env:
        VERSION: ${{ inputs.version }}
        ARCH: ${{ inputs.arch }}
        RELEASE: ${{ inputs.release }}
        UPLOAD_TOKEN: ${{ inputs.github-token }}

    - name: Keep the smoke test's logs
      if: failure()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: smoke-test-${{ runner.os }}-${{ inputs.arch || runner.arch }}
        path: |
          ${{ runner.temp }}/smoke-test/*/smoke-test.log
          ${{ runner.temp }}/smoke-test/*/logs
        if-no-files-found: ignore
        retention-days: 7

    # Stored as they are: the packages are compressed already, and zipping them again slowed the Intel
    # Mac's upload to a third of Linux's.
    - if: inputs.release == ''
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: package-${{ runner.os }}-${{ inputs.arch || runner.arch }}
        compression-level: 0
        path: |
          apps/desktop/out/*.exe
          apps/desktop/out/*.exe.blockmap
          apps/desktop/out/*.AppImage
          apps/desktop/out/*.deb
          apps/desktop/out/*.rpm
          apps/desktop/out/*.dmg
          apps/desktop/out/*-mac.zip
          apps/desktop/out/*-mac.zip.blockmap
          apps/desktop/out/latest*.yml
          apps/desktop/out/nightly*.yml
        if-no-files-found: error
        retention-days: 3

    # The update file publishing merges with the other processor's, the one file a draft release's
    # runners share.
    - if: inputs.release != ''
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: update-files-${{ runner.os }}-${{ inputs.arch || runner.arch }}
        path: |
          apps/desktop/out/latest*.yml
          apps/desktop/out/nightly*.yml
        if-no-files-found: error
        retention-days: 3
