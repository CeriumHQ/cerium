name: Collect the headless CLI release
description: Gather all six native archives, verify their checksums and include the public installers.
inputs:
  version:
    description: The version being published.
    required: true
runs:
  using: composite
  steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        pattern: cli-*
        merge-multiple: true
        path: ${{ runner.temp }}/cli-release
    - shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: node scripts/host-release.ts "$RUNNER_TEMP/cli-release" "$VERSION"
