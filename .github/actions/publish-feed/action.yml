name: Publish the update feed
description: >-
  Publishes a release's installer, blockmap and update files, with the AppImage, to the public releases repository, the feed
  the installed app updates from (apps/desktop/src/updater.ts) while the source repository stays private.
  A nightly also prunes the feed's older nightlies. Without a token it warns and publishes nothing.

inputs:
  tag:
    description: The release's tag, from scripts/release.ts.
    required: true
  title:
    description: The release's title, from scripts/release.ts.
    required: true
  notes-file:
    description: The release notes scripts/release.ts wrote.
    required: true
  nightly:
    description: Whether this is a nightly, published as a prerelease with nightly.yml and nightly-linux.yml.
    required: true
  token:
    description: A token that may write the releases repository's contents.
    required: false
    default: ""
  repository:
    description: The public releases repository; apps/desktop/electron-builder.ts reads the same one.
    required: false
    default: nonlooped/cerium-releases

runs:
  using: composite
  steps:
    - shell: bash
      run: |
        if [ -z "$GH_TOKEN" ]; then
          echo "::warning::CERIUM_RELEASES_TOKEN isn't set, so $TAG wasn't published to $GH_REPO and installed apps won't see it."
          exit 0
        fi
        if [ "$NIGHTLY" = true ]; then
          feed=nightly
          flags=(--prerelease --latest=false)
        else
          feed=latest
          flags=(--latest)
        fi
        files=(apps/desktop/out/*.exe apps/desktop/out/*.exe.blockmap "apps/desktop/out/$feed.yml"
          apps/desktop/out/*.AppImage "apps/desktop/out/$feed-linux.yml")
        # A rerun finds the release already there and replaces its files.
        if gh release view "$TAG" >/dev/null 2>&1; then
          gh release upload "$TAG" "${files[@]}" --clobber
        else
          gh release create "$TAG" "${files[@]}" --title "$TITLE" --notes-file "$NOTES" "${flags[@]}"
        fi
        if [ "$NIGHTLY" = true ]; then
          gh release list --limit 200 --json tagName,isPrerelease,createdAt \
            --jq '[.[] | select(.isPrerelease and (.tagName | test("-nightly[.]")))] | sort_by(.createdAt) | reverse | .[].tagName' |
            tail -n +"$((NIGHTLIES_KEPT + 1))" |
            while read -r tag; do
              gh release delete "$tag" --cleanup-tag --yes || echo "::warning::Couldn't delete the nightly $tag from $GH_REPO"
            done
        fi
      env:
        GH_TOKEN: ${{ inputs.token }}
        GH_REPO: ${{ inputs.repository }}
        TAG: ${{ inputs.tag }}
        TITLE: ${{ inputs.title }}
        NOTES: ${{ inputs.notes-file }}
        NIGHTLY: ${{ inputs.nightly }}
